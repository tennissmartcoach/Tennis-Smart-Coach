/* ---------- scoring engine ---------- */
function newState(f){
  const st = {sets:[], g:[0,0], p:[0,0], tb:null, server:f.first, done:null, won:[0,0]};
  if(f.type!=='set') st.tb = {target: f.type==='tb7'?7:10, first:f.first, whole:true};
  return st;
}
function tbServer(st){ const n = st.p[0]+st.p[1]; if(n===0) return st.tb.first; return Math.floor((n-1)/2)%2===0 ? 1-st.tb.first : st.tb.first; }
function curServer(st){ return st.tb ? tbServer(st) : st.server; }
function setWon(f, st, w){
  st.won[w]++; st.g=[0,0];
  const need = f.sets===3 ? 2 : 1;
  if(st.won[w]>=need){ st.done=w; return; }
  if(f.sets===3 && st.won[0]===1 && st.won[1]===1 && f.decider==='tb10') st.tb = {target:10, first:st.server, decider:true};
}
function applyPoint(f, st, w){
  if(st.done!==null) return;
  const o = 1-w;
  if(st.tb){
    st.p[w]++;
    if(st.p[w]>=st.tb.target && st.p[w]-st.p[o]>=2){
      const tb = st.tb, sc = [...st.p];
      st.p=[0,0]; st.tb=null;
      if(tb.whole){ st.sets.push({a:sc[0], b:sc[1]}); st.won[w]++; st.done=w; }
      else if(tb.decider){ st.sets.push({a:sc[0], b:sc[1], stb:true}); st.won[w]++; st.done=w; }
      else { st.g[w]++; st.sets.push({a:st.g[0], b:st.g[1], tb:Math.min(sc[0],sc[1])}); st.server = 1-tb.first; setWon(f, st, w); }
    }
    return;
  }
  st.p[w]++;
  const gameWon = f.ad ? (st.p[w]>=4 && st.p[w]-st.p[o]>=2) : st.p[w]>=4;
  if(!gameWon) return;
  st.p=[0,0]; st.g[w]++; st.server = 1-st.server;
  const G = f.games, gw = st.g[w], go = st.g[o];
  if(gw>=G && gw-go>=2){ st.sets.push({a:st.g[0], b:st.g[1]}); setWon(f, st, w); }
  else if(f.tb && st.g[0]===G && st.g[1]===G) st.tb = {target:7, first:st.server};
}
function replay(m){ const st = newState(m.format); m.points.forEach(p=>applyPoint(m.format, st, p.w)); return st; }
function isPressure(f, st){
  if(st.done!==null) return false;
  const [a,b] = st.p;
  if(st.tb){ const t = st.tb.target; return (a>=t-2 && b>=t-2) || (Math.max(a,b)>=t-1 && Math.abs(a-b)<=1); }
  if(!f.ad && a===3 && b===3) return true;
  return (a>=3 && b>=2) || (b>=3 && a>=2);
}
function ptLabel(f, st, i){
  if(st.tb) return String(st.p[i]);
  const me = st.p[i], ot = st.p[1-i];
  if(me>=3 && ot>=3){ if(me===ot) return '40'; return me>ot ? 'V' : '40'; }
  return ['0','15','30','40'][Math.min(me,3)];
}
function statusTags(f, st){
  const t = [];
  if(st.done!==null) return [['Partita finita','hot']];
  if(st.tb) t.push([st.tb.decider ? 'Super tie-break' : 'Tie-break', '']);
  else if(!f.ad && st.p[0]===3 && st.p[1]===3) t.push(['Killer point','hot']);
  else if(st.p[0]>=3 && st.p[1]>=3 && st.p[0]===st.p[1]) t.push(['Parità','']);
  if(isPressure(f, st)) t.push(['Punto importante','hot']);
  return t;
}
function formatLabel(f){
  if(f.type==='tb7') return 'Tie-break a 7';
  if(f.type==='tb10') return 'Tie-break a 10';
  let s = (f.sets===1 ? '1 set' : '2 set su 3') + ' a ' + f.games + ' game';
  s += f.tb ? ', tie-break sul ' + f.games + '-' + f.games : ', senza tie-break';
  if(f.sets===3) s += f.decider==='tb10' ? ', 3° set super tie-break' : '';
  return s + (f.ad ? ', con vantaggi' : ', killer point');
}
function scoreLine(st){ const l = st.sets.map(x=> x.stb ? `[${x.a}-${x.b}]` : `${x.a}-${x.b}${x.tb!==undefined?`(${x.tb})`:''}`); if(st.done===null && (st.g[0]||st.g[1])) l.push(`${st.g[0]}-${st.g[1]}`); return l.join('  '); }

/* ---------- stats ---------- */
function matchStats(m){
  const n = m.choices.length;
  const rows = m.choices.map((label,i)=>({label, n:0, ex:0, exn:0, won:0, prn:0, prw:0}));
  const none = {label:'Nessuna scelta', n:0, won:0, prn:0, prw:0, ex:0, exn:0};
  let won=0, srv=0, srvW=0, ret=0, retW=0, prn=0, prw=0;
  m.points.forEach(p=>{
    const r = p.ch===null || p.ch===undefined ? none : rows[p.ch];
    if(!r) return;
    const w = p.w===0;
    r.n++; if(w){ r.won++; won++; }
    if(p.ex!==null && p.ex!==undefined){ r.exn++; if(p.ex) r.ex++; }
    if(p.pr){ r.prn++; prn++; if(w){ r.prw++; prw++; } }
    if(p.srv===0){ srv++; if(w) srvW++; } else { ret++; if(w) retW++; }
  });
  return {rows, none, tot:m.points.length, won, srv, srvW, ret, retW, prn, prw};
}
function mergeStats(list){
  const by = {};
  list.forEach(m=>{ const s = matchStats(m); s.rows.forEach(r=>{ const k = r.label; by[k] = by[k] || {label:k, n:0, won:0, ex:0, exn:0, prn:0, prw:0}; ['n','won','ex','exn','prn','prw'].forEach(f=>by[k][f]+=r[f]); }); });
  return Object.values(by).filter(r=>r.n>0).sort((a,b)=>b.n-a.n);
}

/* ---------- ui state ---------- */
const U = { step:'role', code:'', group:null, athlete:null, pin:'', err:'', tab:null, weekOpen:null, day:null, cnt:{ok:0,tot:0}, resGroup:null, resWeek:null, athleteOpen:null, matchOpen:null, setup:null, sel:{ch:undefined, ex:null}, confirm:null, newGroup:false };
const me = () => S.athletes.find(a=>a.id===S.session?.athleteId);
const grp = id => (typeof id==='string' && id.startsWith('pp_')) ? ppGroup(id.slice(3)) : S.groups.find(g=>g.id===id);
/* private pupil programme: a pseudo-group kept in priv[aid].pg, weeks in priv[aid].own */
function ppGroup(aid){ const a = ath(aid); if(!a) return undefined; const pv = privOf(aid); if(!pv.pg) return undefined; pv.pg.name = a.name; return pv.pg; }
const ath = id => S.athletes.find(a=>a.id===id);
const isCoach = () => S.session?.role==='coach';
const isStaff = r => r==='coach' || r==='fit' || r==='mind';
const ROLE_NAME = {fit:'Preparatore atletico', mind:'Preparatore mentale'};
/* sessions are numbered 1–5: the coach ticks each one when it is done, so a missed day can be made up on any other day */
const gwk = g => isOwnG(g) ? 'o'+ownOf(g.id).cur : String(g.week);
const sDone = g => ((g && g.sdone) || {})[gwk(g)] || {};
const doneDate = (g,di) => sDone(g)[di] || '';
/* how many sessions a week the group trains: with the 12-week programme fewer sessions keep the first and the last (the comparison of the prova) */
const PICK12 = {2:[0,4], 3:[0,2,4], 4:[0,1,2,4], 5:[0,1,2,3,4]};
const nS = g => g && g.pp ? Math.min(5, Math.max(1, g.freq || 1)) : Math.min(5, Math.max(2, (g && g.freq) || 5));
const pickOf = g => isOwnG(g) ? [0,1,2,3,4].slice(0, nS(g)) : PICK12[nS(g)];
const sNo = (g,di) => pickOf(g).indexOf(di) + 1;
const sLabel = (g,di) => 'Allenamento ' + (sNo(g,di) || di+1);
function curIdx(g){ if(!g || g.id===PRIV_ID) return -1; const m = sDone(g), t = todayISO(), pk = pickOf(g); for(const i of pk.slice().reverse()) if(m[i]===t) return i; for(const i of pk) if(!m[i]) return i; return -1; }
function nextFree(g){ const m = sDone(g); for(const i of pickOf(g)) if(!m[i]) return i; return -1; }
function todayIdx(g){ if(g){ const i = curIdx(g), pk = pickOf(g); return i<0 ? pk[pk.length-1] : i; } const d = new Date().getDay(); return d>=1 && d<=5 ? d-1 : 4; }
function sessDots(g){ const m = sDone(g), pk = pickOf(g); return `<span class="sdots" aria-label="${pk.filter(i=>m[i]).length} allenamenti su ${pk.length} fatti">${pk.map((i,k)=>`<i class="${m[i]?'on':''}">${k+1}</i>`).join('')}</span>`; }
function sessBtns(g, di){ if(S.session.role!=='coach' || !g) return '';
  if(nextFree(g)<0) return `<div class="note"><b>Settimana completata.</b> Tutti e ${pickOf(g).length} gli allenamenti sono fatti.</div><button class="btn clay" data-a="weeknext" data-k="${g.id}">Passa alla settimana ${isOwnG(g)?ownOf(g.id).cur+1:Math.min(12,g.week+1)}</button>`;
  const dd = doneDate(g,di), nx = nextFree(g);
  return dd ? `<div class="row"><button class="btn ghost" data-a="sessdone" data-k="${g.id}:${di}" style="flex:1">✓ Fatto ${dd===todayISO()?'oggi':fdate(dd)} · annulla</button>${nx>=0?`<button class="btn ghost" data-a="sessdone" data-k="${g.id}:${nx}" style="flex:1">Oggi anche il ${sNo(g,nx)} (recupero)</button>`:''}</div>` : `<button class="btn" data-a="sessdone" data-k="${g.id}:${di}">Segna l'allenamento ${sNo(g,di)} come fatto</button>`; }
const sessHead = (g, di, title) => nextFree(g)<0 ? 'Settimana completata ✓' : `${sLabel(g,di)}: ${title}`;
let toastT;
function toast(msg){ let t = document.querySelector('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t);} t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),1800); }

/* ---------- icons ---------- */
const IC = {

  test:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 13l4-4"/><path d="M3.5 17a9 9 0 1 1 17 0"/><circle cx="12" cy="13" r="1.5"/></svg>',

  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.3 0 4 1.4 4.6 4"/></svg>'
};

/* ---------- render ---------- */
function render(){
  try{ renderInner(); }catch(e){ console.error(e); document.getElementById('app').innerHTML = `<section class="card" style="margin:16px"><h2>Qualcosa non ha funzionato</h2><p class="small">Questa schermata non si è potuta aprire. I dati sono al sicuro.</p><p class="small muted">${String(e&&e.message||e).replace(/</g,'&lt;')}</p><button class="btn clay" onclick="U.tab=null;U.tOpen=null;U.mEdit=null;U.oWeek=null;U.oDay=null;U.athleteOpen=null;render()">Torna alla Home</button></section>`; }
}
function renderInner(){
  const root = document.getElementById('app');
  if(S.session?.role==='student' && !me()) S.session=null;
  if(!S.session){ root.innerHTML = loginView(); return; }
  const role = S.session.role;
  const isPriv = !isStaff(role) && me()?.groupId===PRIV_ID;
  const tabs = role==='fit' ? [['fhome','Home',IC.home],['fprog','Programma',IC.plan],['sath','Atleti',IC.people],['stest','Test',IC.test],['tour','Tornei',IC.trophy]]
    : role==='mind' ? [['mhome','Home',IC.home],['mprog','Programma',IC.plan],['sath','Atleti',IC.people],['mschede','Schede',IC.form],['tour','Tornei',IC.trophy]]
    : role==='coach'
    ? [['home','Home',IC.home],['plan','Programma',IC.plan],['match','Match Analysis',IC.match],['ath','Gruppi e atleti',IC.people],['tour','Tornei',IC.trophy]]
    : role==='parent'
    ? (isPriv ? [['phome','Home',IC.home],['pprog','Programma',IC.today],['stours','Tornei',IC.trophy],['prog','Profilo',IC.user]] : [['phome','Home',IC.home],['pweek','Settimana',IC.today],['stours','Tornei',IC.trophy],['prog','Profilo',IC.user],['meet','Incontro',IC.chat]])
    : (isPriv ? [['shome','Home',IC.home],['pprog','Programma',IC.today],['match','Match Analysis',IC.match],['stours','Tornei',IC.trophy],['prog','Profilo',IC.user]]
              : [['shome','Home',IC.home],['week','Settimana',IC.plan],['match','Match Analysis',IC.match],['stours','Tornei',IC.trophy],['prog','Profilo',IC.user]]);
  if(!U.tab) U.tab = tabs[0][0];
  const who = role==='coach' ? 'Maestro' : ROLE_NAME[role] ? ROLE_NAME[role] : (role==='parent' ? 'Genitore di ' : '') + esc(me()?.name) + ' · ' + esc(grp(me()?.groupId)?.name);
  let body = '';
  switch(U.tab){
    case 'today': body = noticesFor('student', me().groupId) + todayView(); break;
    case 'fhome': body = fitHome(); break;
    case 'mhome': body = mindHome(); break;
    case 'sath': body = U.athleteOpen && ath(U.athleteOpen) ? athleteView(U.athleteOpen) : staffAthList(); break;
    case 'stest': body = `<h1>Test</h1><div class="seg" role="group"><button data-a="ftmode" data-k="fit" aria-pressed="${U.ftMode!=='prog'}">Test atletici</button><button data-a="ftmode" data-k="prog" aria-pressed="${U.ftMode==='prog'}">Test del programma</button></div>` + (U.ftMode==='prog' ? testsView() : fitTestsView()); break;
    case 'mschede': body = mindSchede(); break;
    case 'mprog': body = mprogView(); break;
    case 'fprog': body = fitProgView(); break;
    case 'shome': body = U.mfill ? mfillView() : U.form ? formView() : studentHome(); break;
    case 'phome': body = parentHome(); break;
    case 'prog': body = U.mfill ? mfillView() : U.form ? formView() : athleteView(me().id, true); break;
    case 'stours': body = athleteTours(); break;
    case 'forms': body = U.form ? formView() : formsList(); break;
    case 'pweek': body = noticesFor('parent', me().groupId) + (isOwnG(grp(me().groupId)) ? ownWeekCard(grp(me().groupId)) : parentWeek()); break;
    case 'meet': body = U.form ? formView() : meetView(); break;
    case 'pmatch': body = summaryView(S.matches.find(m=>m.id===U.matchOpen)); break;
    case 'plan': body = planView(); break;
    case 'ath': body = (U.athleteOpen && ath(U.athleteOpen)) ? athleteView(U.athleteOpen) + athManage(ath(U.athleteOpen)) : (U.athPriv && ath(U.athPriv)) ? privDetail(U.athPriv) + athManage(ath(U.athPriv)) : athList(); break;
    case 'priv': body = U.privOpen && ath(U.privOpen) ? privDetail(U.privOpen) : privList(); break;
    case 'week': body = isOwnG(grp(me().groupId)) ? ownWeekCard(grp(me().groupId)) : studentWeek(); break;
    case 'home': body = coachHome(); break;
    case 'tour': body = isCoach() ? toursView() : staffTours(); break;
    case 'pprog': body = noticesFor(S.session.role, me().groupId) + privStudentView(); break;
    case 'groups': body = groupsView(); break;
    case 'match': body = matchTab(); break;
  }
  if(U.tdEd) body = tdefView();
  root.innerHTML = `
    <header class="top"><svg class="mark" viewBox="0 0 120 120" aria-hidden="true"><rect x="1.5" y="1.5" width="117" height="117" rx="27" fill="#18222F" stroke="#2A374B" stroke-width="3"/><rect x="24" y="68" width="18" height="28" rx="5" fill="#FFFFFF" fill-opacity=".45"/><rect x="50" y="52" width="18" height="44" rx="5" fill="#FFFFFF" fill-opacity=".7"/><rect x="76" y="44" width="18" height="52" rx="5" fill="#FFFFFF"/><circle cx="85" cy="25" r="13" fill="#D7E84A"/></svg><div class="t"><small>TENNIS</small><b>Smart Coach</b><span>${who}</span></div><button data-a="logout">Esci</button></header>
    <main>${exampleNote()}${body}</main>
    <div class="tabs"><nav>${tabs.map(([k,l,i])=>`<button data-a="tab" data-k="${k}" ${U.tab===k?'aria-current="page"':''} style="position:relative">${i}<span>${l}</span>${k==='ath'&&newForms()?`<b class="dot" aria-label="${newForms()} schede nuove">${newForms()}</b>`:''}</button>`).join('')}</nav></div>`;
}
function tdefView(){
  const E = U.tdEd, custom = (S.ftests||[]).some(t=>t.tdef);
  return `<button class="btn ghost" data-a="tdclose" style="align-self:flex-start">‹ Indietro</button>
    <h1>Prove dei test</h1><p class="small muted">Le prove che gli atleti fanno nelle settimane ${TEST_WEEKS.join(', ')}. I risultati già salvati restano: se togli una prova, i suoi vecchi risultati non si vedono più nella tabella.</p>

function athleteView(id, self){

  const res = S.results.filter(r=>r.athleteId===id);
  const groups = {};
  res.slice().sort((x,y)=>x.week-y.week||x.day-y.day||(x.date<y.date?-1:1)).forEach(r=>{ const pv = PV(r.week,r.day); const k = pv.t+'|'+(r.kind||pv.k); (groups[k] = groups[k] || {t:pv.t, kind:r.kind||pv.k, rows:[]}).rows.push(r); });
  const ms = S.matches.filter(m=>m.done && (m.a.id===id));
  const merged = mergeStats(ms.filter(m=>m.mode!=='task'));
  const tms = ms.filter(m=>m.mode==='task');
  const tw = TEST_WEEKS.filter(n=>S.tests.some(x=>x.athleteId===id&&x.week===n));
  const tabs = role==='parent' ? ATABS.slice(0,3) : role==='fit' ? ATABS.slice(0,3) : role==='mind' ? [ATABS[0],ATABS[2],ATABS[3]] : ATABS;
  let tab = U.athTab || 'prof'; if(!tabs.some(t=>t[0]===tab)) tab = tabs[0][0];

      <div class="seg" role="group">${PAREAS.map(([k,l])=>`<button data-a="goalarea" data-k="${k}" aria-pressed="${(U.goalArea||(S.session.role==='mind'?'men':'tec'))===k}">${l}</button>`).join('')}</div>

      : (pv.goals.length?`<section class="card"><h3>I miei obiettivi</h3>${goalsHtml(pv,false,id)}</section>`:''));
    body = (role==='coach'?`<button class="btn clay" data-a="finalopen" data-k="${id}">Profilo di fine ciclo</button>`:'') + (pc || '<section class="card"><p class="muted">Il maestro non ha ancora condiviso la scheda.</p></section>') + goals + notesCard(id) + staffNotesCard(id) + (role==='fit' ? '' : X.tipo + X.arma);
  } else if(tab==='allen'){
    body = `<section class="card"><h3>Prove del giorno</h3>
      <p class="muted small">Ogni prova con i suoi risultati nel tempo: quando una prova torna, si vede se il numero cresce.</p>
      ${Object.keys(groups).length?Object.values(groups).map(gp=>{ const mx = gp.kind==='min' ? Math.max(...gp.rows.map(r=>r.ok),1) : null;
        return `<div class="field"><b>${esc(gp.t)}</b><div class="bars">${gp.rows.map(r=>{ const v = gp.kind==='min' ? r.ok/mx*100 : pct(r.ok,r.tot); return `<div class="bar"><div class="lab"><span>Sett. ${r.week} · ${DAYS_S[r.day]}</span><span>${resVal(r)}${gp.kind==='min'?' in 1 minuto':''}</span></div><div class="track"><div class="fill" style="width:${v}%;background:${wcol(r.week)}"></div></div></div>`; }).join('')}</div></div>`; }).join(''):`<p class="muted">Ancora nessuna prova salvata.</p>`}
      </section>` + staffProgCards(id) + fitTestsCard(id) + attCard(id) + (role!=='parent'?wellCard(id):'') + ((role==='coach'||role==='fit') ? testEntry(id) : `<section class="card"><h3>Test</h3>${testTable(id)}</section>`);
  } else if(tab==='tour'){

        <div class="kpi"><b>${tw.length?tw.join(' · '):'–'}</b><span>test fatti (settimane)</span></div>
        <div class="kpi"><b>${ms.length}</b><span>partite analizzate</span></div>
      </div>
    </section>
    <div class="seg sub" role="group" style="position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:4">${tabs.map(([k,l])=>`<button data-a="athtab" data-k="${k}" aria-pressed="${tab===k}">${l}</button>`).join('')}</div>

const isOwnG = g => !!g && g.prog==='own';
const blankDay = () => ({title:'', note:'', ex:[]});
const dayLab = (g,i) => g && g.pp ? 'Lezione '+(i+1) : DAYS[i];
const blankWeek = () => ({name:'', days:[0,1,2,3,4].map(blankDay)});
function ownOf(gid){ let o; if(typeof gid==='string' && gid.startsWith('pp_')){ const pv = privOf(gid.slice(3)); o = pv.own = pv.own || {cur:1, weeks:[]}; } else { S.own = S.own || {}; o = S.own[gid] = S.own[gid] || {cur:1, weeks:[]}; } if(!o.weeks.length) o.weeks.push(blankWeek()); if(o.cur>o.weeks.length) o.cur = o.weeks.length; return o; }
const gWeekNo = g => isOwnG(g) ? ownOf(g.id).cur : g.week;
const gWeekName = g => { if(!isOwnG(g)) return W(g.week).name; const o = ownOf(g.id), w = o.weeks[o.cur-1]; return w.name || `Settimana ${o.cur}`; };
const gDayTitle = (g,di) => { if(!isOwnG(g)) return P.prog[g.week][di].title; const o = ownOf(g.id), d = o.weeks[o.cur-1].days[di]; return d.title || 'Seduta da definire'; };

/* own programmes: d.ex = exercise ids, d.exPh = the group phase each one is placed in */
function mapPh(g, e){ const w = lessonOf(g).phases.filter(p=>!p.pause); if(!w.length) return (e && e.ph) || 'pr'; const k = e ? (e.ph==='ri'?'pr':e.ph) : ''; return w.some(p=>p.k===k) ? k : w[0].k; }
function ownPh(g, d, i){ return (d.exPh && d.exPh[i]) || mapPh(g, exById(d.ex[i])); }
function ownSync(g, d){ d.exPh = d.ex.map((id,i)=>ownPh(g, d, i)); return d; }
function ownItems(g, d){ return d.ex.map((id,i)=>({i, id, e:exById(id), ph:ownPh(g,d,i)})).filter(x=>x.e); }
function ownByPhase(g, d, render, adders){
  const L = lessonOf(g), items = ownItems(g, d);
  if(!L.phases.length) return items.map(x=>render(x)).join('') + (adders ? adders(null) : '');
  const keys = L.phases.filter(p=>!p.pause).map(p=>p.k); let np = 0;
  const out = L.phases.map(p=>{
    if(p.pause){ np++; return pauseRow(`${esc(p.n)}${p.m?' · '+p.m+"'":''}`, 'Acqua e recupero.'); }
    const its = items.filter(x=>x.ph===p.k);
    return (its.length ? its.map(x=>render(x)).join('') : (adders ? `<p class="small"><b>${esc(p.n)}</b>${p.m?' · '+p.m+"'":''}</p>` : '')) + (adders ? adders(p) : '');
  }).join('');
  const lost = items.filter(x=>!keys.includes(x.ph));
  return out + (lost.length ? `<p class="small muted">Esercizi in fasi che non ci sono più:</p>` + lost.map(x=>render(x)).join('') : '');
}

const fdate = d => new Date(d).toLocaleDateString('it-IT',{day:'numeric',month:'short'});
const formsOf = (id, kind) => S.forms.filter(f=>f.athleteId===id && f.kind===kind).sort((a,b)=>a.date<b.date?-1:1);
function tipoResult(ans, tq){
  tq = tq || defTpl('tipo').tq; const c = {}; TYPES.forEach(t=>c[t[0]]=0);
  Object.entries(ans).forEach(([i,o])=>{ const q = tq[+i]; if(q && q.o[o] && c[q.o[o].ty]!==undefined) c[q.o[o].ty]++; });
  const order = TYPES.map(t=>t[0]).sort((a,b)=>c[b]-c[a]);
  return {c, first:order[0], second:order[1]};
}
const tname = k => TYPES.find(t=>t[0]===k)[1];
const tipoOf = f => tipoResult(f.ans, tplOf(f).tq);
function tipoBars(ans, tq){
  tq = tq || defTpl('tipo').tq; const r = tipoResult(ans, tq), N = tq.length || 1;
  return `<div class="bars">${TYPES.map(([k,n])=>`<div class="bar"><div class="lab"><span>${n}</span><span>${r.c[k]} su ${N}</span></div><div class="track"><div class="fill" style="width:${r.c[k]/N*100}%;background:${tcol(k)}"></div></div></div>`).join('')}</div>`;
}
function rateSeg(key, val){ return `<div class="seg" role="group">${[1,2,3,4,5].map(n=>`<button data-a="rate" data-k="${key}" data-v="${n}" aria-pressed="${val===n}">${n}</button>`).join('')}</div>`; }
function formsList(){
  const a = me(), g = grp(a.groupId);
  const card = (kind, when, desc) => { const fs = formsOf(a.id, kind), last = fs[fs.length-1];
    let res = '';
    if(last && kind==='tipo'){ const r = tipoOf(last); res = `<p class="small">Ultimo risultato: <b>${tname(r.first)}</b>, poi ${tname(r.second)}</p>`; }
    if(last && kind==='arma') res = `<p class="small">La mia arma: <b>${esc(last.ans.arma||'–')}</b></p>`;
    return `<section class="card"><div class="row between"><h2>${esc(fname(kind))}</h2><span class="tag teal">${when}</span></div><p class="muted small">${desc}</p>${res}
      ${fs.length?`<p class="small muted">Compilata ${fs.length} ${fs.length===1?'volta':'volte'} · ultima il ${fdate(last.date)} (sett. ${last.week})</p>`:''}
      <button class="btn block" data-a="openform" data-k="${kind}">Compila</button></section>`; };
  const mine = ['pre','post','sett','tipo','arma'].filter(k=>formFor(k, a));

    ${!mine.includes('tipo')?'':card('tipo','Sett. 1 · 6 · 12',tplNow('tipo').tq.length+' situazioni di gioco. Rispondi con quello che fai davvero, non con quello che vorresti fare.')}
    ${!mine.includes('arma')?'':card('arma','Sett. 1 · 6 · 12','Quanto ti fidi di ogni colpo e quanto lo usi nei punti importanti.')}`;

function formView(){

      <div class="field"><label>La scelta che ho usato di più</label><div class="chips">${w.choices.map((c,i)=>`<button class="chip" data-a="rate" data-k="used" data-v="${i}" aria-pressed="${A.used===i}">${esc(c.label)}</button>`).join('')}</div></div>

  if(F.kind==='gen') return `${head}

function arrowPath(x1,y1,x2,y2,curve){
  if(!curve) return `M${x1} ${y1}L${x2} ${y2}`;
  const mx=(x1+x2)/2, my=(y1+y2)/2, dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1, k=.18*len;
  let nx=-dy/len, ny=dx/len; if(ny>0){ nx=-nx; ny=-ny; }
  return `M${x1} ${y1}Q${(mx+nx*k).toFixed(1)} ${(my+ny*k).toFixed(1)} ${x2} ${y2}`;
}

    const SH = x.lezioni || [], SE = SH.reduce((t,l)=>t+(l.fasi||[]).reduce((u,f)=>u+(f.esercizi||[]).length,0),0), SC = SH.reduce((t,l)=>t+(l.fasi||[]).reduce((u,f)=>u+(f.esercizi||[]).filter(e=>(e.campo||[]).length).length,0),0);

/* ---------- private lessons: read a programme PDF ----------
   The PDF is NOT stored: pdf.js (loaded only when needed) reads its text, the coach checks the fields found
   (objective, frequency, goals by area) and only those go into the card. Keeps the app light. */
const PDF_MAX = 20*1024*1024;
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const kbLab = n => n>=1048576 ? (n/1048576).toFixed(1).replace('.',',')+' MB' : Math.max(1,Math.round(n/1024))+' KB';
let pdfjsP = null;
function loadPdfJs(){
  return pdfjsP = pdfjsP || new Promise((ok,ko)=>{ const sc = document.createElement('script'); sc.src = PDFJS+'pdf.min.js';
    sc.onload = ()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS+'pdf.worker.min.js'; ok(window.pdfjsLib); };
    sc.onerror = ()=>{ pdfjsP = null; ko(new Error('pdf.js non raggiungibile')); }; document.head.appendChild(sc); });
}
async function pdfText(buf){
  const lib = await loadPdfJs(), doc = await lib.getDocument({data:buf}).promise; let out = '';
  for(let i=1; i<=doc.numPages; i++){ const c = await (await doc.getPage(i)).getTextContent(); let y = null;
    c.items.forEach(it=>{ const yy = it.transform ? it.transform[5] : y; if(y!==null && Math.abs(yy-y)>2 && !out.endsWith('\n')) out += '\n'; out += it.str; if(it.hasEOL) out += '\n'; y = yy; });
    out += '\n'; }
  return out;
}
/* finds "Obiettivo del percorso", "Frequenza / Periodo" and the goals under Tecnica, Tattica, Mentale, Fisico (as headings or "Tecnica: ...") */
const PDF_AREA = {tecnica:'tec', tecnico:'tec', tecnici:'tec', tattica:'tat', tattico:'tat', tattici:'tat', mentale:'men', mentali:'men', testa:'men', fisico:'fis', fisica:'fis', fisici:'fis', atletica:'fis', atletico:'fis', 'preparazione fisica':'fis', 'preparazione atletica':'fis'};
function pdfParse(txt){
  const out = {title:'', freq:'', goals:[]}, key = x => x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
  let sect = null, area = null;
  txt.split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean).forEach(raw=>{
    const bullet = /^(?:[-•*·▪●◦–]|\d+[.)])\s/.test(raw), l = raw.replace(/^(?:[-•*·▪●◦–]|\d+[.)])\s*/,'').trim(); if(!l) return;
    const m = l.match(/^([^:]{2,40}):\s*(.*)$/), head = key(m ? m[1] : l), rest = m ? m[2].trim() : '';
    const ar = PDF_AREA[head.replace(/^(obiettivi|obiettivo|area|aspetti|aspetto|lavoro) /,'')];
    if(/^(obiettivo|obiettivi)( (del percorso|generale|generali|principale|finale))?$|^finalita$/.test(head) && (m || l.length<40)){ sect = 'title'; area = null; if(rest) out.title += (out.title?' ':'')+rest; return; }
    if(/^(frequenza|periodo|durata|quando)( [a-z]+){0,3}$/.test(head) && (m || l.length<40)){ sect = 'freq'; area = null; if(rest) out.freq += (out.freq?' · ':'')+rest; return; }
    if(ar && (m || l.length<40)){ sect = 'goals'; area = ar; if(rest) out.goals.push({area, text:rest}); return; }
    if(/^(settimana|lezione|mese|week|programma|esercizi|note)\b/.test(head) || (m && !rest) || (l.length<40 && l===l.toUpperCase() && /[A-Z]/.test(l))){ sect = null; area = null; return; }
    const cont = !bullet && /^[a-zà-ù(]/.test(l);
    if(sect==='title') out.title += (out.title?' ':'')+l;
    else if(sect==='freq') out.freq += (out.freq?(cont?' ':' · '):'')+l;
    else if(sect==='goals'){ const g = out.goals[out.goals.length-1]; if(cont && g && g.area===area) g.text += ' '+l; else out.goals.push({area, text:l}); }
  });
  const cap = x => x.charAt(0).toUpperCase()+x.slice(1);

  return out;
}
async function pdfLoad(aid, f){
  U.pdfErr = null;
  if(!/pdf$/i.test(f.type||'') && !/\.pdf$/i.test(f.name||'')){ U.pdfErr = {aid, msg:'Il file scelto non è un PDF.'}; render(); return; }
  if(f.size>PDF_MAX){ U.pdfErr = {aid, msg:`Il PDF è troppo grande (${kbLab(f.size)}).`}; render(); return; }
  U.pdfBusy = aid; U.pdfDraft = null; render();
  try{
    let txt = ''; try{ txt = (await pdfText(await f.arrayBuffer())).trim(); }catch(e){ console.warn(e); }
    if(/tennis-smart-coach|"allievi"\s*:/.test(txt)){ U.pdfErr = {aid, msg:'Questo PDF contiene il testo da importare, non una scheda da leggere. Apri la sua pagina in Lezioni private, tocca "Incolla programma o lezione" e incolla lì il testo preparato in chat.'}; U.pdfBusy = null; render(); return; }
    const P = txt ? pdfParse(txt) : null, lab = Object.fromEntries(PAREAS);
    U.pdfDraft = !txt ? {aid, fail:true} : {aid, text:txt.slice(0,4000), title:P.title, freq:P.freq, goals:P.goals.map(g=>lab[g.area]+': '+g.text).join('\n'), none:!P.title && !P.freq && !P.goals.length};
    if(!txt) toast('Non riesco a leggere il testo del PDF');
  }catch(e){ console.error(e); U.pdfErr = {aid, msg:'Non sono riuscito ad aprire il file. Riprova.'}; }
  U.pdfBusy = null; render();
}

/* ---------- dates ---------- */
const todayISO = () => { const d = new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const MONTHS = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const dLabel = iso => { const d = new Date(iso+'T12:00'); return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3); };
function firstMonday(y){ const j1 = new Date(Date.UTC(y,0,1)); const add = (8 - j1.getUTCDay()) % 7; return new Date(Date.UTC(y,0,1+add)); }
function weekMonday(year, n){ return new Date(firstMonday(year).getTime() + (n-1)*7*864e5).toISOString().slice(0,10); }
function weekOf(iso){ const t = new Date(iso+'T00:00Z'); let y = t.getUTCFullYear(); if(t < firstMonday(y)) y--; return {year:y, n:1+Math.floor((t-firstMonday(y))/(7*864e5))}; }

const myRes = () => { const x = tByKey(U.tOpen); const id = me().id; x.t.results = x.t.results || {}; return (x.t.results[id] = x.t.results[id] || {}); };
const wtype = k => WTYPES.find(t=>t[0]===k) || WTYPES[0];
function seasonOf(y){ S.season = S.season || {}; return S.season[y] = S.season[y] || {weeks:{}}; }
function weekData(y,n){ const s = seasonOf(y); return s.weeks[n] = s.weeks[n] || {type:'', t:[], note:''}; }
const addDays = (iso,n) => { const d = new Date(iso+'T12:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
function tSpan(t,y,n){ const mon = weekMonday(y,n), st = t.start || mon; let en = t.end || addDays(mon,6); if(en < st) en = st; return [st,en]; }
const isAlt = x => x.i>0 && !x.t.solo;
const TROLES = [['main','1ª scelta'],['alt','Alternativa'],['extra','Torneo in più']];
const tRole = x => x.i===0 ? 'main' : x.t.solo ? 'extra' : 'alt';
const roleSeg = (k, cur) => `<div class="seg" role="group" aria-label="Ruolo nella settimana">${TROLES.map(([r,l])=>`<button data-a="trole" data-k="${k}" data-v="${r}" aria-pressed="${cur===r}">${l}</button>`).join('')}</div>`;
function setTourRole(k, role){
  const x = tByKey(k); if(!x) return k; const w = weekData(x.y,x.n), t = x.t;
  const oldMain = x.i!==0 && w.t[0] && w.t[0].name ? w.t[0] : null;
  const others = w.t.filter((z,i)=>i!==x.i && i!==0 && z.name);
  const blank = {name:'',kind:'',deadline:'',info:'',players:[],results:{}};
  let arr;
  if(role==='main'){ t.solo = false; if(oldMain) oldMain.solo = false; arr = [t, ...(oldMain?[oldMain]:[]), ...others]; }
  else { t.solo = role==='extra'; arr = [oldMain || blank, ...others, t]; }
  w.t = arr; if(!w.type) w.type = 'comp';
  return `${x.y}:${x.n}:${arr.indexOf(t)}`;
}
function setTourDates(k, st, en){
  const x = tByKey(k); if(!x) return k; const t = x.t;
  if(!st){ delete t.start; delete t.end; return k; }
  const wo = weekOf(st), mon = weekMonday(wo.year, wo.n);
  if(en && en < st) en = st;
  if(st===mon && (!en || en===addDays(mon,6))){ delete t.start; delete t.end; } else { t.start = st; if(en) t.end = en; else delete t.end; }
  if(wo.year===x.y && wo.n===x.n) return k;
  const src = weekData(x.y,x.n).t; if(x.i===0 && src.length>1) src[0] = {name:'',kind:'',deadline:'',info:'',players:[],results:{}}; else src.splice(x.i,1);
  const dst = weekData(wo.year, wo.n); if(!dst.type) dst.type = 'comp';
  let i; if(dst.t[0] && !dst.t[0].name){ dst.t[0] = t; i = 0; } else { t.solo = true; dst.t.push(t); i = dst.t.length-1; }
  return `${wo.year}:${wo.n}:${i}`;
}
function allTournaments(){
  const out = [];
  Object.entries(S.season||{}).forEach(([y,s])=>Object.entries(s.weeks).forEach(([n,w])=>(w.t||[]).forEach((t,i)=>{ if(t.name){ const [st,en] = tSpan(t,+y,+n); out.push({y:+y, n:+n, i, t, date:st, end:en}); } })));
  return out.sort((a,b)=>a.date<b.date?-1:1);
}
/* ---------- who a tournament is for: t.who = {groups:[], aths:[]} (empty = everyone) ---------- */
const tWho = t => ({all:false, groups:(t.who&&t.who.groups)||[], aths:(t.who&&t.who.aths)||[]});
const tForAll = t => !t.who;
const tForAth = (t, a) => tForAll(t) || tWho(t).groups.includes(a.groupId) || tWho(t).aths.includes(a.id) || (t.players||[]).includes(a.id) || (t.requests||[]).includes(a.id);
function tVisible(t){
  const r = S.session && S.session.role;
  if(r==='student' || r==='parent'){ const a = me(); return a ? tForAth(t, a) : true; }
  const f = U.tFor || 'all'; if(f==='all') return true;
  if(f==='everyone') return tForAll(t);
  const [k, id] = f.split(':');
  if(k==='g') return !tForAll(t) && (tWho(t).groups.includes(id) || tWho(t).aths.some(x=>ath(x)?.groupId===id));
  if(k==='a'){ const a = ath(id); if(!a) return true; return (t.players||[]).includes(a.id) || (!tForAll(t) && (tWho(t).groups.includes(a.groupId) || tWho(t).aths.includes(a.id))); }
  return true;
}

/* ---------- attendance ---------- */
const attKey = (date,g,kind) => date+'|'+g+(kind?'|'+kind:'');
const ATT_ST = [['p','Presente'],['a','Assente'],['r','Ritardo'],['w','Pioggia']];
const ATT_KIND = {'':'Tennis', fit:'Preparazione atletica', mind:'Preparazione mentale'};
const attKindOf = () => S.session.role==='fit' ? 'fit' : S.session.role==='mind' ? 'mind' : '';
const attIcon = v => v==='p'?'✓':v==='r'?'R':v==='w'?'☂':'✗';
const attCls = v => v==='g' ? 'a' : v;
const attPresent = v => v==='p' || v==='r';
function attView(){
  const kind = U.attKind ?? attKindOf();
  const g = grp(U.attGroup) || teamGroups()[0]; const date = U.attDate || todayISO();
  const rec = (S.att||{})[attKey(date,g.id,kind)] || {};
  const as = S.athletes.filter(a=>a.groupId===g.id), np = as.filter(a=>attPresent(rec[a.id])).length;
  return `<button class="btn ghost" data-a="homeback" style="align-self:flex-start">‹ Home</button>
    <section class="card"><span class="eyebrow">Presenze · ${esc(ATT_KIND[kind])} · ${esc(g.name)}</span><h1>${np} su ${as.length}</h1>
      <input id="f-attdate" class="input" type="date" value="${date}" data-c="attdate">
      <div class="row"><button class="btn ghost" data-a="attall" data-k="p" style="flex:1">Tutti presenti</button><button class="btn ghost" data-a="attall" data-k="w" style="flex:1">Pioggia per tutti</button></div></section>
    <section class="card" style="padding:4px 16px"><div class="list">${as.map(a=>`<div style="display:flex;flex-direction:column;gap:6px;padding:10px 0"><b>${esc(a.name)}</b>
      <div class="seg att" role="group" aria-label="Presenza di ${esc(a.name)}">${ATT_ST.map(([k,l])=>`<button data-a="attset" data-k="${a.id}" data-v="${k}" aria-pressed="${attCls(rec[a.id])===k}">${l}</button>`).join('')}</div></div>`).join('')}</div></section>
    <p class="muted small">Si salva da solo a ogni tocco. Ritardo conta come presente; con la pioggia la seduta non si conta.</p>`;
}
function attStats(id, kind=''){
  const a = ath(id), m = todayISO().slice(0,7), suf = '|'+a.groupId+(kind?'|'+kind:'');
  const rows = Object.entries(S.att||{}).filter(([k])=>k.endsWith(suf) && k.split('|').length===(kind?3:2)).map(([k,v])=>({date:k.split('|')[0], v:v[id]})).filter(x=>x.v).sort((x,y)=>x.date<y.date?-1:1);
  const month = rows.filter(x=>x.date.startsWith(m) && x.v!=='w'), p = month.filter(x=>attPresent(x.v)).length;
  return {rows, month, p};
}
function attCard(id){

    (S.well||[]).filter(w=>w.pain && w.date>=lim7).forEach(w=>out.push({k:'pain', n:1, html:row(act, act==='openathT'?w.athleteId+':allen':w.athleteId, `<b style="color:var(--ko)">${nm(w.athleteId)}</b> segnala dolore${w.where?': '+esc(w.where):''} <span class="small muted">· ${dLabel(w.date)}</span>`)}));
    (S.well||[]).filter(w=>w.fat>=5 && w.date>=lim7).forEach(w=>out.push({k:'fat', n:1, html:row(act, act==='openathT'?w.athleteId+':allen':w.athleteId, `<b>${nm(w.athleteId)}</b>: fatica 5 su 5 <span class="small muted">· ${dLabel(w.date)}</span>`)}));
  };
  const tourRows = () => nextTourPlayers(21).forEach(x=>out.push({k:'tour', n:1, html:row('openT', tKey(x), `<b>${esc(x.t.name)}</b> <span class="small muted">· ${dRange(x.date,x.end)}</span><br><span class="small muted">Giocano: ${x.t.players.map(pid=>nm(pid)).filter(Boolean).join(', ')}</span>`)}));
  if(role==='coach'){
    const reqs = allTournaments().filter(x=>(x.t.requests||[]).length), nf = newForms(), up = upcoming(30), nextT = up.find(x=>x.date>=today) || up[0];
    reqs.forEach(x=>out.push({k:'req', n:x.t.requests.length, html:row('openT', tKey(x), `<b style="color:var(--clay)">${x.t.requests.length} ${x.t.requests.length===1?'richiesta':'richieste'} di iscrizione</b> · ${esc(x.t.name)}`)}));

  } else if(role==='fit'){
    wellRows('staffath'); tourRows();

/* ---------- length and phases of a training session, per group ---------- */
const DEF_PHASES = () => [{k:'att',n:'Attivazione',m:13},{k:'p1',n:'Pausa',m:4,pause:true},{k:'pr',n:'Fase centrale',m:28},{k:'p2',n:'Pausa',m:3,pause:true},{k:'filo',n:'Filo fisso',m:10},{k:'sr',n:'Servizio e risposta',m:17},{k:'ap',n:'Parte aperta · partita',m:30}];
const PHCOL = {att:'#5B6068', pr:'#3B6FD8', ri:'#3B6FD8', filo:'#8A6200', sr:'#0E6670', ap:'#B4532A'};
const XCOL = ['#7A4FB0','#1F8A7A','#9A7400','#C4622D','#5A6270'];
const lessonOf = g => (g && g.lesson) || {dur:105, phases:DEF_PHASES()};
const ensureLesson = g => { if(!g.lesson) g.lesson = {dur:105, phases:DEF_PHASES()}; return g.lesson; };
const phColor = (p,i) => p.pause ? 'var(--sunk)' : (PHCOL[p.k] || XCOL[i % XCOL.length]);
const durTxt = m => { const h = Math.floor(m/60), r = m%60; return h ? `${h} h${r?' '+r+"'":''}` : `${r}'`; };
let CUR_LG = null;
const getLG = () => CUR_LG || grp(U.planGroup) || teamGroups()[0] || null;
function phInfo(k){
  const L = lessonOf(getLG()), kk = k==='ri' ? 'pr' : k, i = L.phases.findIndex(x=>x.k===kk), p = L.phases[i];
  if(p) return [k==='ri' && p.n==='Fase centrale' ? 'Richiamo' : p.n, phColor(p,i), p.m ? p.m+"'" : ''];
  if(PH[k]) return [PH[k][0], PH[k][1], L.phases.length ? PH[k][2] : ''];
  return ['Esercizio','#5A6270',''];
}
const noLesson = g => !lessonOf(g).phases.length;
const NEUTRAL = () => ['att','pr','filo','sr','ap'].map(k=>({k, n:k==='filo'?'Filo fisso':PH[k][0], m:0}));
const workPhases = g => { const w = lessonOf(g).phases.filter(p=>!p.pause && p.k!=='filo'); return w.length ? w : ['att','pr','sr','ap'].map(k=>({k, n:PH[k][0], m:0})); };
function lessonTL(g, fri){
  const L = lessonOf(g); if(!L.phases.length) return `<p class="small muted">Durata e fasi dell'allenamento non ancora impostate${g?' per '+esc(g.name):''}.</p>`; let ph = L.phases.map((p,i)=>({...p, c:phColor(p,i)}));
  if(fri){ const f = ph.find(p=>p.k==='filo'); ph = ph.filter(p=>p.k!=='filo'); const a = ph.find(p=>p.k==='ap'); if(f && a) a.m += f.m; ph.forEach(p=>{ if(p.k==='pr' && p.n==='Fase centrale') p.n='Richiamo'; if(p.k==='ap' && p.n==='Parte aperta · partita') p.n='Match guidato'; }); }
  const tot = ph.reduce((t,p)=>t+(+p.m||0),0);
  return `<div class="tl" aria-hidden="true">${ph.map(p=>`<span style="flex:${Math.max(1,+p.m||0)} 1 0;background:${p.c}">${p.pause?'':esc(p.n)}</span>`).join('')}</div>
    <p class="small muted">${durTxt(tot)} · ${ph.filter(p=>!p.pause).map(p=>`${esc(p.n)} ${p.m}'`).join(' · ')}</p>`;
}
const sortByPhase = (g, exs) => { const ord = lessonOf(g).phases.map(p=>p.k); const ix = e => { const i = ord.indexOf(e.ph==='ri'?'pr':e.ph); return i<0 ? 99 : i; }; return exs.slice().sort((a,b)=>ix(a)-ix(b)); };

      ${!L.phases.length?'<p class="small muted">Nessuna fase: aggiungi le fasi del tuo allenamento con "+ Fase" e "+ Pausa".</p>':''}<p class="small ${diff?'':'muted'}" style="${diff?'color:var(--ko);font-weight:600':''}">Totale ${tot} minuti${diff?` · ${diff>0?diff+' in più':(-diff)+' in meno'} rispetto a ${L.dur}`:(L.dur&&L.phases.length?' · torna con la durata':'')}</p>

/* ---------- paste-to-fill: read a tournament from pasted text or link ---------- */
const MON_ALL = {gen:1,jan:1,feb:2,mar:3,apr:4,mag:5,may:5,giu:6,jun:6,lug:7,jul:7,ago:8,aug:8,set:9,sep:9,ott:10,oct:10,nov:11,dic:12,dec:12};
function parseTournament(txt){
  const out = {name:'', date:'', deadline:'', info:'', cat:''};
  const raw = (txt||'').trim(); if(!raw) return out;
  const url = (raw.match(/https?:\/\/\S+/)||[])[0] || '';
  const iso = (y,m,d) => { y = +y; if(y<100) y += 2000; const s = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; return isNaN(new Date(s+'T12:00')) ? '' : s; };
  const found = []; const spans = [];
  const free = (i,len) => !spans.some(([a,b])=>i<b && i+len>a);
  const push = (pos, len, d) => { if(d && free(pos,len)){ found.push({pos, date:d}); spans.push([pos,pos+len]); } };
  const guessY = (mo, d) => { const now = new Date(); let y = now.getFullYear(); const t = new Date(y, mo-1, d); if(t < new Date(now.getTime()-45*864e5)) y++; return y; };
  const mon = w => MON_ALL[(w||'').slice(0,3).toLowerCase()];
  let m;
  const R = [
    [/\b(\d{4})-(\d{2})-(\d{2})\b/g, m=>iso(m[1],m[2],m[3])],
    [/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/g, m=>iso(m[3],m[2],m[1])],
    [/\b(\d{1,2})(?:\s*[-–\/]\s*\d{1,2})?\s+([A-Za-zàéì]{3,})\.?,?\s+(\d{4})\b/g, m=>mon(m[2])?iso(m[3],mon(m[2]),m[1]):''],
    [/\b([A-Za-z]{3,})\.?\s+(\d{1,2})(?:\s*[-–]\s*(?:[A-Za-z]{3,}\.?\s+)?\d{1,2})?,?\s+(\d{4})\b/g, m=>mon(m[1])?iso(m[3],mon(m[1]),m[2]):''],
    [/\b(\d{1,2})(?:\s*[-–\/]\s*\d{1,2})?\s+([A-Za-zàéì]{3,})\b\.?/g, m=>mon(m[2])?iso(guessY(mon(m[2]),+m[1]),mon(m[2]),m[1]):''],
    [/\b([A-Za-z]{3,})\.?\s+(\d{1,2})\b(?!\s*[:.]\d)/g, m=>mon(m[1])?iso(guessY(mon(m[1]),+m[2]),mon(m[1]),m[2]):''],
    [/\b(\d{1,2})[\/.](\d{1,2})\b(?![\/.]\d)/g, m=>(+m[2]>=1&&+m[2]<=12&&+m[1]<=31)?iso(guessY(+m[2],+m[1]),m[2],m[1]):'']
  ];
  R.forEach(([re,fn])=>{ re.lastIndex=0; while((m = re.exec(raw))) push(m.index, m[0].length, fn(m)); });
  found.sort((a,b)=>a.pos-b.pos);
  // deadline: a date within ~60 chars after a deadline keyword
  const kw = /(entry\s*deadline|deadline|closing date|entries close|entry closes|scadenza|termine iscrizion\w*|iscrizion[ei]\s*(entro|chiusura)?|chiusura iscrizioni|withdrawal|sign[\s-]*in)/ig;
  let dl = null; while((m = kw.exec(raw))){ const f = found.find(x=>x.pos>=m.index && x.pos<=m.index+80); if(f){ dl = f; break; } }
  if(dl) out.deadline = dl.date;
  const rest = found.filter(x=>x!==dl).map(x=>x.date).sort();
  if(rest.length) out.date = rest[0];
  // category
  const cat = raw.match(/super\s*category|category\s*[1-3]|cat\.?\s*[1-3]|\b(1[2-8])\s*(&|and|e)?\s*(under|U)\b|\bU\s?1[2-8]\b|under\s*1[2-8]/ig);
  if(cat) out.cat = [...new Set(cat.map(c=>c.replace(/\s+/g,' ').trim()))].slice(0,3).join(' · ');
  // name: first meaningful line, else from link
  const MONRE = '(?:gen|jan|feb|mar|apr|mag|may|giu|jun|lug|jul|ago|aug|set|sep|ott|oct|nov|dic|dec)[a-zàéì]*\\.?';
  const strip = l => l.replace(/https?:\/\/\S+/g,'')
    .replace(/\b\d{4}-\d{2}-\d{2}\b/g,'').replace(/\b\d{1,2}[\/.\-]\d{1,2}([\/.\-]\d{2,4})?\b/g,'')
    .replace(new RegExp('\\b\\d{1,2}(\\s*[-–\\/]\\s*\\d{1,2})?\\s+'+MONRE+'(,?\\s+\\d{4})?','ig'),'')
    .replace(new RegExp('\\b'+MONRE+'\\s+\\d{1,2}\\b(,?\\s+\\d{4})?','ig'),'')
    .replace(/\b(entry\s*deadline|deadline|closing date|entries close|entry closes|scadenza( iscrizioni)?|termine iscrizion\w*|tournament dates?|dates?|dal|al|ore|surface|superficie)\b\s*:?/ig,'')
    .replace(/\b\d{1,2}[:.]\d{2}\b/g,'').replace(/[|•]/g,' ').replace(/\s[-–]\s/g,' ').replace(/\s{2,}/g,' ').replace(/^[\s:·,\-–]+|[\s:·,\-–]+$/g,'').trim();
  const generic = /^(tennis europe( junior tour)?|junior tour|tournament( details| info)?|home|menu|calendar|calendario|tornei)$/i;
  const lines = raw.split(/\n+/).map(strip).filter(l=>l.length>3 && l.length<90 && /[A-Za-z]{3}/.test(l) && !generic.test(l) && !/^(category|cat\.)\s*\d$/i.test(l) && !/^(surface|superficie|draw|tabellone)\b/i.test(l));
  if(lines.length) out.name = lines[0];
  if(!out.name && url){ const slug = decodeURIComponent(url.split('/').filter(Boolean).pop()||'').replace(/[-_]+/g,' ').replace(/\.\w+$/,'').replace(/\b\d+\b/g,'').trim(); if(slug) out.name = slug.replace(/\b\w/g,c=>c.toUpperCase()); }
  if(out.cat && out.name && !out.name.toLowerCase().includes(out.cat.split(' · ')[0].toLowerCase())) out.name += ' · ' + out.cat;
  out.info = url;
  return out;
}

  day(k){ U.day=+k; U.cnt={ok:0,tot:0}; U.timer=null; clearInterval(U.tick); },
  cnt(k){ const pv=PV(grp(me().groupId).week,U.day); if(U.cnt.tot>=pv.n) return; U.cnt.tot++; if(k==='1') U.cnt.ok++; U.cnt.hist=(U.cnt.hist||[]).concat(k==='1'); if(navigator.vibrate) try{navigator.vibrate(15)}catch(e){} },
  cntmin(){ U.cnt.ok++; U.cnt.tot++; U.cnt.hist=(U.cnt.hist||[]).concat(true); if(navigator.vibrate) try{navigator.vibrate(15)}catch(e){} },
  timer(){ U.cnt={ok:0,tot:0}; U.timer=Date.now()+60000; clearInterval(U.tick); U.tick=setInterval(()=>{ const el=document.getElementById('timer'); const left=Math.max(0,Math.ceil((U.timer-Date.now())/1000)); if(el) el.textContent = left?left+'"':'Tempo!'; if(!left){ clearInterval(U.tick); if(navigator.vibrate) try{navigator.vibrate([200,100,200])}catch(e){} toast('Tempo! Ora salva'); } },250); },
  cntundo(){ const h=U.cnt.hist||[]; if(!h.length) return; const l=h.pop(); U.cnt.tot--; if(l) U.cnt.ok--; },

['pointerup','pointercancel','pointerleave'].forEach(n=>document.addEventListener(n, ()=>clearTimeout(LP_T)));
document.addEventListener('pointermove', e=>{ if(Math.abs(e.movementX||0)+Math.abs(e.movementY||0)>6) clearTimeout(LP_T); });
document.addEventListener('contextmenu', e=>{ const t = e.target.closest && e.target.closest('[data-lp]'); if(!t) return; e.preventDefault(); clearTimeout(LP_T); lpOpen(t.dataset.lp); });
document.addEventListener('click', e=>{
  if(LP_FIRED){ LP_FIRED = false; if(e.target.closest && e.target.closest('[data-lp]')){ e.preventDefault(); return; } }
  const t = e.target.closest('[data-a]'); if(!t || t.disabled) return;
  const fn = ACT[t.dataset.a]; if(!fn) return;
  fn(t.dataset.k, t.dataset, e); render();
});
document.addEventListener('change', e=>{
  const t = e.target, c = t.dataset?.c;
  if(c==='impfile'){ const f = t.files && t.files[0]; if(f){ f.text().then(txt=>{ const r = impParse(txt, U.impFor||null); if(r.err){ U.impErr=r.err; U.impData=null; } else { U.impErr=''; U.impData=r; } render(); }); } t.value=''; return; }
  if(c==='pdffile'){ const f = t.files && t.files[0]; if(f) pdfLoad(t.dataset.k, f); t.value=''; return; }
  if(c==='tfres'){ const [pid,f]=t.dataset.k.split(':'); const x=tByKey(U.tOpen); x.t.results=x.t.results||{}; (x.t.results[pid]=x.t.results[pid]||{})[f]=t.value; save(); return; }
  if((c==='tf'||c==='tnew') && t.type==='date'){ render(); return; }
  if(c==='tres'){ const [i,pid,f]=t.dataset.k.split(':'); const tt=weekData(U.tWeek.y,U.tWeek.n).t[+i]; tt.results=tt.results||{}; (tt.results[pid]=tt.results[pid]||{})[f]=t.value; save(); return; }
  if(c==='tdates' && U.tOpen){ U.tOpen=setTourDates(U.tOpen, document.getElementById('tf-st').value, document.getElementById('tf-en').value); save(); render(); return; }
  if(c==='mtdate'){ const j=t.dataset.j; setTourDates(t.dataset.k, document.getElementById('md-s-'+j).value, document.getElementById('md-e-'+j).value); save(); render(); return; }
  if(c==='mwtype'){ const [y,n]=t.dataset.k.split(':').map(Number); weekData(y,n).type=t.value; save(); render(); return; }
  if(c==='edlib' && U.ed){ U.ed.lib=t.checked; return; }
  if(c==='ftdate'){ U.ftDate=t.value||todayISO(); render(); return; }
  if(c==='ftgrp'){ U.ftGroup=t.value; render(); return; }
  if(c==='fpgrp'){ U.fpGroup=t.value; U.fpWeek=null; render(); return; }
  if(c==='mrgrp'){ U.mrGroup=t.value; U.mrAth=''; U.maOpen=null; render(); return; }
  if(c==='mrath'){ U.mrAth=t.value; U.maOpen=null; render(); return; }
  if(c==='mfgrp'){ U.mfGroup=t.value; render(); return; }
  if(c==='fitdate'){ U.fitDate=t.value||todayISO(); render(); return; }
  if(c==='snshare'){ U.snShare=t.checked; return; }
  if(c==='cleantour'){ U.clean.sel[t.dataset.k]=t.checked; return; }
  if(c==='cleanopt'){ U.clean[t.dataset.k]=t.checked; return; }
  if(c==='athname'){ const a=ath(t.dataset.k), v=t.value.trim(); if(a && v){ a.name=v; save(); toast('Nome aggiornato'); render(); } return; }
  if(c==='athmove'){ const a=ath(t.dataset.k); if(a){ a.groupId=t.value; if(t.value===PRIV_ID) privOf(a.id); save(); toast(a.name+' spostato'); render(); } return; }
  if(c==='athgrp'){ U.resGroup=t.value; U.athleteOpen=null; render(); return; }
  if(c==='lessondur'){ const g=grp(U.lessonEd), n=Math.max(30,Math.min(240,+t.value||0)); if(g && n){ lessonSnap(); scalePhases(ensureLesson(g), n); save(); render(); } return; }
  if(c==='phmin'){ lessonSnap(); const L=ensureLesson(grp(U.lessonEd)); L.phases[+t.dataset.k].m=Math.max(0,Math.min(240,+t.value||0)); save(); render(); return; }
  if(c==='mmf' && (t.type==='date'||t.type==='time')){ const [cid,mid,f]=t.dataset.k.split(':'); const m=(mCycle(cid)?.meets||[]).find(x=>x.id===mid); if(m){ m[f]=t.value; save(); render(); } return; }
  if(c==='mmform'){ const [cid,mid]=t.dataset.k.split(':'); const m=(mCycle(cid)?.meets||[]).find(x=>x.id===mid); if(m){ m.formId=t.value||undefined; save(); render(); } return; }
  if(c==='tfor'){ U.tFor=t.value; U.tOpen=null; render(); return; }
  if(c==='bty' && U.biEd){ const [i,j]=t.dataset.k.split(':').map(Number); U.biEd.tq[i].o[j].ty=t.value; return; }
  if(c==='omove'){ const d=ownSync(grp(U.planGroup), ownOf(U.planGroup).weeks[U.oWeek-1].days[U.oDay]); d.exPh[+t.dataset.k]=t.value; save(); render(); return; }
  if(c==='plangrp'){ U.planGroup=t.value; U.weekOpen=null; U.dayOpen=null; U.oWeek=null; U.oDay=null; render(); return; }
  if(c==='attdate'){ U.attDate=t.value||todayISO(); render(); return; }
  if(c==='tour' && t.type==='date'){ render(); return; }
  if(!c || !U.setup) return;
  const s = U.setup;
  if(c==='mgroup'){ s.groupId=t.value; const g=grp(t.value); s.a=S.athletes.find(x=>x.groupId===g.id)?.id||''; s.b=''; s.choices=W(g.week).choices.map(x=>x.label); render(); }
  if(c==='ma'){ s.a=t.value; if(s.b===s.a) s.b=''; render(); }
  if(c==='mb'){ s.b=t.value; render(); }
});
document.addEventListener('focusin', e=>{ if(e.target && e.target.dataset && e.target.dataset.c==='phname') lessonSnap(); });
document.addEventListener('input', e=>{
  if(e.target && e.target.dataset && e.target.dataset.c==='phname'){ const L=ensureLesson(grp(U.lessonEd)); L.phases[+e.target.dataset.k].n=e.target.value; save(); return; }
  const t = e.target, c = t.dataset?.c;
  if(c==='ftext' && U.form){ U.form.ans[t.dataset.k]=t.value; return; }
  if(c==='ed' && U.ed){ U.ed[t.dataset.k]=t.value; return; }
  if(c==='pdfd' && U.pdfDraft){ U.pdfDraft[t.dataset.k]=t.value; return; }
  if(c==='ainotes'){ U.aiNotes = U.aiNotes || {}; U.aiNotes[aiKey()] = t.value; return; }
  if(c==='pv' && U.pvDraft){ U.pvDraft[t.dataset.k]=t.value; return; }
  if(c==='pf' && U.profDraft){ U.profDraft[t.dataset.k]=t.value; return; }
  if(c==='fitplan'){ S.fitPlan=S.fitPlan||{}; (S.fitPlan[t.dataset.k]=S.fitPlan[t.dataset.k]||{})[U.fitDate||todayISO()]=t.value; save(); return; }
  if(c==='ftn' && U.ftNew){ U.ftNew[t.dataset.k]=t.value; return; }
  if(c==='filo'){ S.filoEdit=S.filoEdit||{}; S.filoEdit[t.dataset.k]=t.value; save(); return; }
  if(c==='grname'){ const g=grp(U.resGroup); if(g){ g.name=t.value; save(); } return; }
  if(c==='fpwname'){ fitProgOf(U.fpGroup).weeks[U.fpWeek-1].name=t.value; save(); return; }
  if(c==='fpdt'){ fitProgOf(U.fpGroup).weeks[U.fpWeek-1].days[+t.dataset.k].title=t.value; save(); return; }
  if(c==='fpdx'){ fitProgOf(U.fpGroup).weeks[U.fpWeek-1].days[+t.dataset.k].text=t.value; save(); return; }
  if(c==='mcf'){ const cy=mCycle(U.mcOpen); if(cy){ cy[t.dataset.k]=t.value; save(); } return; }
  if(c==='mmf' && t.type!=='date' && t.type!=='time'){ const [cid,mid,f]=t.dataset.k.split(':'); const m=(mCycle(cid)?.meets||[]).find(x=>x.id===mid); if(m){ m[f]=t.value; save(); } return; }
  if(c==='mmnote'){ S.mnotes=S.mnotes||{}; S.mnotes[t.dataset.k]=t.value; save(); return; }
  if(c==='ppnote'){ const pv=privOf(t.dataset.k); pv.card=pv.card||{}; pv.card.notes=t.value; save(); return; }
  if(c==='shnote'){ const [sid,f]=t.dataset.k.split(':'); for(const pv of Object.values(S.priv||{})){ const x=(pv.sheets||[]).find(z=>z.id===sid); if(x){ x[f]=t.value; save(); break; } } return; }
  if(c==='tdl' && U.tdEd){ U.tdEd[+t.dataset.k].l=t.value; return; }
  if(c==='tdu' && U.tdEd){ U.tdEd[+t.dataset.k].u=t.value; return; }
  if(c==='bit' && U.biEd){ U.biEd[t.dataset.k]=t.value; return; }
  if(c==='biq' && U.biEd){ U.biEd.qs[+t.dataset.k].l=t.value; return; }
  if(c==='bio' && U.biEd){ U.biEd.qs[+t.dataset.k].os=t.value; return; }
  if(c==='bis' && U.biEd){ U.biEd.shots[+t.dataset.k].n=t.value; return; }
  if(c==='btq' && U.biEd){ U.biEd.tq[+t.dataset.k].q=t.value; return; }
  if(c==='bto' && U.biEd){ const [i,j]=t.dataset.k.split(':').map(Number); U.biEd.tq[i].o[j].t=t.value; return; }
  if(c==='med' && U.mEd){ U.mEd[t.dataset.k]=t.value; return; }
  if(c==='medq' && U.mEd){ U.mEd.qs[+t.dataset.k].t=t.value; return; }
  if(c==='mfa' && U.mfDraft){ U.mfDraft.a[+t.dataset.k]=t.value; return; }
  if(c==='owname'){ ownOf(U.planGroup).weeks[U.oWeek-1].name=t.value; save(); return; }
  if(c==='odtitle'){ ownOf(U.planGroup).weeks[U.oWeek-1].days[U.oDay].title=t.value; save(); return; }
  if(c==='odnote'){ ownOf(U.planGroup).weeks[U.oWeek-1].days[U.oDay].note=t.value; save(); return; }
  if(c==='mtname'){ const x=tByKey(t.dataset.k); if(x){ x.t.name=t.value; save(); } return; }
  if(c==='tpaste'){ U.tPaste=t.value; return; }
  if(c==='lk' && U.lkDraft){ U.lkDraft[t.dataset.k]=t.value; return; }
  if(c==='tnew' && U.tNew){ U.tNew[t.dataset.k]=t.value; return; }
  if(c==='tf' && U.tOpen){ const x=tByKey(U.tOpen); x.t[t.dataset.k]=t.value; save(); return; }
  if(c==='tfres' && t.tagName==='INPUT'){ const [pid,f]=t.dataset.k.split(':'); const x=tByKey(U.tOpen); x.t.results=x.t.results||{}; (x.t.results[pid]=x.t.results[pid]||{})[f]=t.value; save(); return; }
  if(c==='mm' && U.tOpen){ const [i,f]=t.dataset.k.split(':'); const r=myRes(); r.matches[+i][f]=t.value; save(); return; }
  if(c==='mres' && U.tOpen){ myRes()[t.dataset.k]=t.value; save(); return; }
  if(c==='twnote'){ weekData(U.tWeek.y,U.tWeek.n).note=t.value; save(); return; }
  if(c==='tour'){ const [i,f]=t.dataset.k.split(':'); weekData(U.tWeek.y,U.tWeek.n).t[+i][f]=t.value; save(); return; }
  if(c==='tres' && t.tagName==='INPUT'){ const [i,pid,f]=t.dataset.k.split(':'); const tt=weekData(U.tWeek.y,U.tWeek.n).t[+i]; tt.results=tt.results||{}; (tt.results[pid]=tt.results[pid]||{})[f]=t.value; save(); return; }
  if(c==='wwhere' && U.wellDraft){ U.wellDraft.where=t.value; return; }
  if(c==='restore'){ U.restoreText=t.value; return; }
  if(c==='libq'){ U.libQ=t.value; U.libN=40; const pos=t.selectionStart; render(); const n=document.getElementById('f-libq'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } return; }
  if(c==='task' && U.setup){ U.setup.tasks[+t.dataset.k]=t.value; return; }
  if(!c || !U.setup) return;
  if(c==='choice') U.setup.choices[+t.dataset.k]=t.value;
  if(c==='mbn') U.setup.bName=t.value;
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  if(e.target.id==='f-code'){ ACT.code(); render(); }
  if(e.target.id==='f-coach'){ ACT.coachin(); render(); }
});

S = load();
render();
</script>
