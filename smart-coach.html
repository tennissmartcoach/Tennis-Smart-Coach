<title>Tennis Smart Coach</title>
<meta name="theme-color" content="#0F1620">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one-column phone app, header + scrolling content + bottom tab bar; court-side controls are big and high-contrast */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E3E8EE; --ink:#15203A; --muted:#566173; --line:#D3DAE3;
  --pri:#1B3A6B; --on-pri:#FFFFFF; --pri-soft:#E2E9F4; --pri-ink:#1B3A6B;
  --clay:#B4532A; --clay-soft:#F6E5DC; --teal:#0E6670; --teal-soft:#DDEFF0; --ochre:#8A6200;
  --ok:#1E7A4C; --ok-soft:#DDF1E5; --ko:#B0372B; --ko-soft:#F7E0DD;
  --board:#14284B; --board-ink:#F4F6FA; --board-dim:#93A6C6; --ball:#D7E84A;
  --f-disp:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Source Sans 3','Segoe UI',Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141E; --surface:#172131; --sunk:#1F2B3D; --ink:#E6EBF2; --muted:#9AA6B8; --line:#2A374B;
  --pri:#2F5BA0; --on-pri:#FFFFFF; --pri-soft:#1D2D48; --pri-ink:#9DBCF0;
  --clay:#E2804F; --clay-soft:#3A2419; --teal:#3FB3BE; --teal-soft:#14303A; --ochre:#D9A93A;
  --ok:#4CC587; --ok-soft:#163626; --ko:#F07A6C; --ko-soft:#3D1D1A;
  --board:#0A1424; --board-ink:#F4F6FA; --board-dim:#8296B8; --ball:#D7E84A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141E; --surface:#172131; --sunk:#1F2B3D; --ink:#E6EBF2; --muted:#9AA6B8; --line:#2A374B;
  --pri:#2F5BA0; --on-pri:#FFFFFF; --pri-soft:#1D2D48; --pri-ink:#9DBCF0;
  --clay:#E2804F; --clay-soft:#3A2419; --teal:#3FB3BE; --teal-soft:#14303A; --ochre:#D9A93A;
  --ok:#4CC587; --ok-soft:#163626; --ko:#F07A6C; --ko-soft:#3D1D1A;
  --board:#0A1424; --board-ink:#F4F6FA; --board-dim:#8296B8; --ball:#D7E84A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--clay);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:30px} h2{font-size:24px} h3{font-size:19px}
p{margin:0}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pri);color:var(--on-pri);padding:12px 16px;display:flex;align-items:center;gap:12px}
.top .mark{width:30px;height:30px;border-radius:50%;background:var(--ball);flex:none;position:relative;overflow:hidden}
.top .mark::before,.top .mark::after{content:"";position:absolute;width:30px;height:30px;border:2px solid #fff;border-radius:50%;top:0;opacity:.9}
.top .mark::before{left:-19px}.top .mark::after{left:19px}
.top .t{flex:1;min-width:0}
.top .t b{display:block;font-family:var(--f-disp);font-size:21px;letter-spacing:.02em;line-height:1}
.top .t span{font-size:13px;opacity:.85;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:rgba(255,255,255,.14);border:0;color:var(--on-pri);border-radius:999px;padding:6px 12px;font-size:14px}
main{flex:1;padding:16px 16px 104px;display:flex;flex-direction:column;gap:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:flex}
.tabs button{flex:1;background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:13px;font-weight:600}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--pri-ink)}
.tabs button[aria-current="page"] svg{stroke:var(--clay)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-family:var(--f-disp);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--clay)}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:4px;gap:4px}
.seg.sub{overflow-x:auto;scrollbar-width:none}
.seg.sub button{flex:1 0 auto;font-size:13px;padding:9px 6px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:10px 6px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:700;font-size:16px;background:var(--pri);color:var(--on-pri)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.clay{background:var(--clay);color:var(--on-clay,#fff)}
.btn.danger{background:var(--ko-soft);color:var(--ko)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600;color:var(--muted)}
.input{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;width:100%;font-size:17px}
.input.code{text-transform:uppercase;letter-spacing:.08em;font-family:var(--f-disp);font-size:24px;font-weight:600}
select.input{appearance:auto}
.pinrow{display:flex;flex-direction:column;gap:6px;padding:8px 0}
.pin{font-family:var(--f-disp);font-size:18px;color:var(--ink);margin:0 4px;letter-spacing:.05em}
.chip.mini{padding:2px 8px;font-size:13px}
.pinl{white-space:nowrap;display:inline-flex;align-items:center;gap:2px}
.err{background:var(--ko-soft);color:var(--ko);border-radius:10px;padding:10px 12px;font-weight:600;font-size:15px}
.note{background:var(--teal-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14px}
.note b{color:var(--teal)}
.list{display:flex;flex-direction:column}
.list>*{padding:12px 0;border-top:1px solid var(--line)}
.list>*:first-child{border-top:0;padding-top:0}
.list>*:last-child{padding-bottom:0}
.item{display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;width:100%;padding-left:0;padding-right:0}
.item .grow{flex:1;min-width:0}
.item .chev{color:var(--muted);font-size:22px}
.wk{width:44px;height:44px;border-radius:10px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-disp);font-weight:700;font-size:20px;line-height:1;flex:none}
.wk small{font-size:10px;font-weight:600;letter-spacing:.06em;opacity:.85}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--clay-soft);color:var(--clay)}
.tag.teal{background:var(--teal-soft);color:var(--teal)}
.tag.pri{background:var(--pri-soft);color:var(--pri-ink)}
.count-box{background:var(--clay-soft);border-radius:10px;padding:12px 14px}
.count-box .eyebrow{color:var(--clay);font-size:13px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:10px;padding:10px 12px;font-weight:600;font-size:15px;min-width:0}
.choice i{font-style:normal;font-family:var(--f-disp);font-weight:700;font-size:20px;color:var(--clay);flex:none}
/* counter */
.counter{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{border:0;border-radius:16px;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--f-disp);font-weight:700;font-size:26px;touch-action:manipulation}
.big span{font-size:42px;line-height:1}
.big.yes{background:var(--ok);color:#fff}
.big.no{background:var(--ko);color:#fff}
.big:active{transform:scale(.98)}
.tally{display:flex;align-items:baseline;justify-content:center;gap:16px;font-family:var(--f-disp)}
.tally .pct{font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tally .frac{font-size:24px;color:var(--muted);font-variant-numeric:tabular-nums}
/* scoreboard */
.board{background:var(--board);color:var(--board-ink);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-family:var(--f-disp)}
.board .hd{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--board-dim);font-weight:600}
.brow{display:grid;grid-template-columns:16px minmax(0,1fr) auto 60px;gap:10px;align-items:center}
.brow .srv{width:12px;height:12px;border-radius:50%;background:transparent}
.brow .srv.on{background:var(--ball);box-shadow:0 0 0 2px rgba(215,232,74,.25)}
.brow .nm{font-size:24px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .sets{display:flex;gap:10px;font-size:24px;color:var(--board-dim);font-variant-numeric:tabular-nums}
.brow .sets b{color:var(--board-ink);font-weight:700}
.brow .pts{background:rgba(255,255,255,.1);border-radius:8px;text-align:center;font-size:32px;font-weight:700;padding:2px 0;font-variant-numeric:tabular-nums}
.board .status{display:flex;gap:8px;flex-wrap:wrap;min-height:22px}
.board .status span{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 8px;background:rgba(255,255,255,.12)}
.board .status .hot{background:var(--clay);color:var(--on-clay,#fff)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 10px;text-align:left;font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center;min-height:56px}
.pick button i{font-style:normal;font-family:var(--f-disp);font-size:22px;font-weight:700;color:var(--clay)}
.pick button[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft)}
.pick button.none{grid-column:1/-1;justify-content:center;min-height:44px;color:var(--muted)}
.exrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exrow button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:700}
.exrow button.y[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.exrow button.n[aria-pressed="true"]{border-color:var(--ko);background:var(--ko-soft);color:var(--ko)}
.winrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.win{border:0;border-radius:14px;padding:18px 10px;font-family:var(--f-disp);font-weight:700;font-size:24px;line-height:1.1;color:#fff;min-height:86px;touch-action:manipulation}
.win small{display:block;font-family:var(--f-body);font-size:13px;font-weight:600;opacity:.85}
.win.a{background:var(--pri)} .win.b{background:#4A5262}
.win:disabled{opacity:.4}
.log{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.log div{display:flex;gap:10px;font-size:14px;align-items:center}
.log .n{color:var(--muted);width:24px;text-align:right;font-variant-numeric:tabular-nums}
.log .g{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* stats */
.bars{display:flex;flex-direction:column;gap:12px}
.bar .lab{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:600}
.bar .lab span:last-child{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:12px;background:var(--sunk);border-radius:999px;overflow:hidden;margin-top:5px}
.fill{height:100%;border-radius:999px;background:var(--pri)}
.fill.ok{background:var(--ok)} .fill.clay{background:var(--clay)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-disp);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:600;line-height:1.2}
.scroll-x{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
table.grid th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:center;padding:4px 2px}
table.grid th:first-child,table.grid td:first-child{text-align:left}
table.grid td{padding:8px 2px;border-top:1px solid var(--line);text-align:center}
.pc{display:inline-block;min-width:44px;border-radius:6px;padding:3px 4px;font-weight:700;font-size:14px}
.pc.h{background:var(--ok-soft);color:var(--ok)} .pc.m{background:var(--sunk);color:var(--ink)} .pc.l{background:var(--ko-soft);color:var(--ko)} .pc.e{color:var(--muted);font-weight:400}
.pin{display:flex;justify-content:center;gap:12px}
.pin span{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted)}
.pin span.f{background:var(--pri);border-color:var(--pri)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{border:0;background:var(--sunk);border-radius:12px;padding:14px;font-family:var(--f-disp);font-size:28px;font-weight:600}
.hero{background:var(--pri);color:var(--on-pri);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.hero h1{font-size:40px}
.hero p{opacity:.9}
.hero .lines{position:absolute;right:-30px;top:-10px;width:170px;height:190px;border:3px solid rgba(255,255,255,.18);border-right:0}
.hero .lines::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:3px solid rgba(255,255,255,.18)}
.dot{position:absolute;top:4px;left:calc(50% + 6px);background:var(--clay);color:var(--on-clay,#fff);border-radius:999px;min-width:18px;height:18px;font-size:11px;line-height:18px;padding:0 5px;font-family:var(--f-body)}
.ex{background:var(--surface);border:1px solid var(--line);border-left:6px solid;border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.phase{color:#fff;font-family:var(--f-disp);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 9px}
.exl{display:flex;flex-direction:column;gap:6px;font-size:15px}
.exl [style*="color"]{color:inherit!important}
.vis{display:flex;justify-content:center}
.vis svg{width:100%;max-width:440px;height:auto;display:block;border-radius:8px}
.vis>div{width:100%!important;max-width:440px}
.vis.edit svg{cursor:crosshair;touch-action:manipulation}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:18px;height:4px;border-radius:2px;display:inline-block}
.legend i.dots{background:repeating-linear-gradient(90deg,var(--pri-ink) 0 2px,transparent 2px 5px)}
.legend .sq{background:#F2C230;color:#2A2522;border-radius:3px;font-size:10px;padding:0 3px}
.pause{display:flex;gap:10px;align-items:baseline;background:var(--sunk);border-radius:10px;padding:8px 12px;font-size:14px}
.pause b{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);flex:none}
.tl{display:flex;height:26px;border-radius:6px;overflow:hidden;font-family:var(--f-disp);font-weight:600;font-size:13px;color:#fff}
.tl span{display:block;text-align:center;line-height:26px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pdot{width:12px;height:12px;border-radius:50%;flex:none}
.goal{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.goal.done{background:var(--ok-soft)} .goal.done p{text-decoration:line-through;text-decoration-color:var(--ok)}
.goal .seg button{font-size:13px;padding:7px 4px}
.tabs button span{text-align:center;line-height:1.1;font-size:12px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.acard:hover{border-color:var(--pri-ink)}
.news{display:flex;justify-content:space-between;align-items:center;background:var(--clay-soft);border:0;border-radius:10px;padding:12px 14px;color:var(--ink);font-size:15px;text-align:left}
.news b{color:var(--clay)}
details.pres{background:var(--sunk);border-radius:10px;padding:10px 12px}
details.pres summary{cursor:pointer}
details.pres .list{margin-top:8px}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero.hero-s{padding:14px 18px}.hero.hero-s h1{font-size:26px}
.hsec{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 2px -4px;font-family:var(--f-body,inherit);font-weight:700}
.wkstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wkstrip button{min-height:58px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px 0;font-family:var(--f-body)}
.wkstrip small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.wkstrip b{font:700 18px var(--f-disp)}.wkstrip i{font-style:normal;color:var(--clay);font-size:14px;line-height:10px;height:10px}
.wkstrip button.today{border-color:var(--clay)}
.wkstrip button[aria-pressed="true"]{background:var(--clay);border-color:var(--clay);color:var(--on-clay)}.wkstrip button[aria-pressed="true"] small,.wkstrip button[aria-pressed="true"] i{color:var(--on-clay)}
.nbadge{min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--clay);color:var(--on-clay);font:700 14px var(--f-body);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ndot{width:10px;height:10px;border-radius:50%;background:var(--clay);flex:none;align-self:center}.ndot.ok{background:var(--ok)}
.gpick{display:flex;gap:8px;overflow-x:auto;margin:-2px -4px 4px;padding:2px 4px 6px;scrollbar-width:none}.gpick::-webkit-scrollbar{display:none}
.gpick button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 14px var(--f-body,inherit);white-space:nowrap}
.gpick button[aria-pressed="true"]{background:var(--clay);border-color:var(--clay);color:var(--on-clay)}
.ticon{width:36px;height:36px;border-radius:10px;background:rgba(215,232,74,.13);color:var(--clay);display:flex;align-items:center;justify-content:center;flex:none}.ticon svg{width:20px;height:20px}
.hbtn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.hbtn b{font-family:var(--f-disp);font-size:18px}.hbtn span{font-size:13px;color:var(--muted)}
.notice{border-color:var(--clay);background:var(--clay-soft)}
.wkrow{align-items:stretch}.wkbar{width:6px;border-radius:3px;flex:none}
.seg.att{width:100%}.seg.att button{flex:1;padding:8px 4px;font-size:14px}
.seg.att button[aria-pressed="true"]{font-weight:700;color:#0F1620}
.seg.att button[data-v="p"][aria-pressed="true"]{background:#4CC587}.seg.att button[data-v="a"][aria-pressed="true"]{background:#F07A6C}
.seg.att button[data-v="r"][aria-pressed="true"]{background:#F2B84B}.seg.att button[data-v="w"][aria-pressed="true"]{background:#8DB6FF}

nzione."],"vis":"<div style=\"width: 200px; height: 88px; flex-shrink: 0; background: #2A2522; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffffff; gap: 2px;\"><div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.05; text-align: center;\">DICHIARO E GIOCO<\/div><div style=\"font-size: 12px; color: #E6E2DA;\">primi 4 colpi<\/div><\/div>"},{"id":"w6d2ap0","w":6,"d":2,"ph":"ap","t":"Tie-break con la routine","chip":"Tie-break a 7, a rotazione","lines":["Tie-break a 7. Unico vincolo: la routine tra i punti — recupero, guardo, scelgo, gioco.","Il maestro osserva solo la routine."],"vis":"<div style=\"width: 200px; height: 88px; flex-shrink: 0; background: #2A2522; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffffff; gap: 2px;\"><div style=\"font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 40px; line-height: 1.05; text-align: center;\">ROUTINE<\/div><div style=\"font-size: 12px; color: #E6E2DA;\">unico vincolo<\/div><\/div>"},{"id":"w6d3att0","w":6,"d":3,"ph":"att","t":"Attivazione libera","chip":"A scelta dei ragazzi","lines":["<b>Esercizio.<\/b> I ragazzi scelgono tra due attivazioni già fatte nel ciclo (per esempio “una profonda, una corta” o “specchio”).","<b>Evoluzione.<\/b> Ultimi 3 minuti a ritmo alto, come prima di una partita."],"vis":""},{"id":"w6d3pr0","w":6,"d":3,"ph":"pr","t":"Il mini-test tecnico-tattico","chip":"4 stazioni da 6 minuti","lines":["<b>Esecuzione.<\/b> Quattro stazioni a rotazione, 6 minuti ciascuna. In ogni stazione si fa la prova una volta per riscaldarsi, poi una volta “vera” che si annota.","<b>Valutazione:<\/b> solo numeri, senza commenti. Il maestro aggiunge un voto 1–5 sulla qualità della scelta nelle stazioni difesa e rete."],"vis":"<div style=\"width: 200px; flex-shrink: 0; display: grid; grid-template-columns: repeat(2, mi arato vale solo se la risposta lo permette. Il maestro premia chi cambia piano al momento giusto.","<b style=\"color: #4A4F57;\">Compito per B:<\/b> varia le risposte apposta per rompere lo schema di A."],"vis":"<div style=\"width: 200px; flex-shrink: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px;\">\n<div style=\"background: #E8EDF5; border-radius: 6px; padding: 6px 7px; font-size: 12px; line-height: 1.25;\"><b style=\"color: #1B3A6B;\">1 · corta al centro<\/b><br/>entro e attacco nello spazio<\/div>\n<div style=\"background: #E8EDF5; border-radius: 6px; padding: 6px 7px; font-size: 12px; line-height: 1.25;\"><b style=\"color: #1B3A6B;\">2 · profonda ai piedi<\/b><br/>ricostruisco in diagonale<\/div>\n<div style=\"background: #E8EDF5; border-radius: 6px; padding: 6px 7px; font-size: 12px; line-height: 1.25;\"><b style=\"color: #1B3A6B;\">3 · sul rovescio<\/b><br/>giro e diritto, o rovescio lungolinea<\/div>\n<div style=\"background: #E8EDF5; border-radius: 6px; padding: 6px 7px; font-size: 12px; line-height: 1.25;\"><b style=\"color: #1B3A6B;\">4 · alta e lenta<\/b><br/>salgo o la prendo al volo<\/div>\n<\/div>"},{"id":"w3d2sr0","w":3,"d":2,"ph":"sr","t":"Servizio al centro + contropiede","chip":"Giocatori, cambio ogni 6 punti","lines":["<b style=\"color: #1B3A6B;\">A al servizio:<\/b> serve al centro e guarda chi risponde: se rientra troppo in fretta, il +1 va <b>dietro all’avversario<\/b>; se resta fermo, nello spazio libero.","<b style=\"color: #4A4F57;\">Compito per B (risposta):<\/b> risposta al centro e recupero rapido.","Si gioca fino al quarto colpo."],"vis":"<svg height=\"100\" style=\"flex-shrink: 0;\" viewbox=\"0 0 220 110\" width=\"200\"><defs><marker id=\"s3c3a\" markerheight=\"5\" markerwidth=\"5\" orient=\"auto\" refx=\"5\" refy=\"3\" viewbox=\"0 0 6 6\"><path d=\"M0 0L6 3L0 6Z\" fill=\"#1B3A6B\"><\/path><\/marker><marker id=\"s3c3b\" markerheight=\"5\" markerwidth=\"5\" orient=\"auto\" refx=\"5\" refy=\"3\" viewbox=\"0 "sr","t":"Servizio e risposta","chip":"","lines":["Servizio esterno e al centro sempre con il +1 (contare le prime nei bersagli su 10), e risposta in anticipo sulla seconda. Solo richiamo degli schemi già usati in settimana."],"vis":""},{"id":"w3d4ap0","w":3,"d":4,"ph":"ap","t":"Match guidato con Match Analysis","chip":"set corti a 4 game","lines":["<b>0–30’<\/b> set con app, prima di ogni punto si dichiara una scelta · <b>30–45’<\/b> quasi libero, resta solo il micro-obiettivo · <b>45–50’<\/b> confronto finale. Registra il maestro o un compagno in panchina."],"vis":""}],"prog":{"1":[{"title":"Conquista del campo","obj":"capire che l’attacco da fondo nasce quasi sempre da una palla precedente di qualità: prima profondità, poi si entra.","count":"Palle oltre la linea dei 3/4 in 1 minuto di palleggio collaborativo (ogni giocatore).","kw":"prima profondità, poi entro","filo":"<b>La palla alta e carica.<\/b> Maestro al cesto, palle alte e lente sul diritto e sul rovescio. Tre risposte: <b>neutralizzo<\/b> (indietreggio e la rimando alta e profonda), <b>salgo<\/b> (entro e la prendo in salita prima che arrivi sopra la spalla), <b>al volo<\/b> (colpo al volo se arriva lenta a metà campo). Prima chiama il maestro, poi sceglie il giocatore.","blocks":{"att":["w1d0att0"],"pr":["w1d0pr0"],"sr":["w1d0sr0"],"ap":["w1d0ap0"]},"alts":[{"t":"Alternativa A · più controllata","x":"Maestro al cesto: due palle profonde nella stessa diagonale, la terza più corta: lì si avanza e si gioca in salita."},{"t":"Alternativa B · riconquista della linea","x":"A tutto campo. B parte un metro dietro la linea di fondo e con profondità e altezza deve riguadagnare spazio. Quando è stabile sulla linea, il punto diventa libero."}]},{"title":"Il diritto come arma","obj":"costruire il diritto come arma senza renderlo una scelta obbligata: si gira attorno alla palla solo quando c’è il tempo.","count":"Diritti girati su palla adatta / diritti girati forzati (troppo profonda o troppo esterna).","kw":"l’arma si costruisce, non si cerca dal nulla","filo":"<b>La seconda di servizio.<\/b> Solo seconde, con rotazione, su un bersaglio grande nella metà profonda del quadrato. Serie da 5: la serie è buona con 4 dentro su 5. Obiettivo: lancio sempre uguale e braccio che accelera anche sulla seconda. Nessun doppio fallo “di paura”: meglio lunga di rotazione che corta e piatta.","blocks":{"att":["w1d1att0"],"pr":["w1d1pr0"],"sr":["w1d1sr0"],"ap":["w1d1ap0"]},"alts":[{"t":"Alternativa A · più controllata","x":"Maestro al cesto con due bersagli, diagonale profonda e lungolinea profondo. Il giocatore sceglie la direzione solo dopo il rimbalzo; il maestro varia profondità e larghezza."},{"t":"Alternativa B · costruisci il diritto","x":"Punto a tutto campo. Vale doppio per A se costruisce il diritto dal centro o dal lato del rovescio senza forzare; vale doppio per B se costringe A a tre rovesci consecutivi."}]},{"title":"Cambio di direzione","obj":"cambiare lungolinea quando la palla lo permette, non “perché non lo si fa da un po’”, e dopo il cambio mantenere il vantaggio creato.","count":"Cambi su palla favorevole / cambi forzati; errori nel colpo subito dopo il cambio.","kw":"costruire · spostare · scegliere · recuperare","filo":"<b>La palla alta in palleggio.<\/b> B gioca solo palle alte e cariche al centro-diagonale. A sceglie ogni volta: <b>neutralizzo<\/b>, <b>salgo in salita<\/b> o <b>al volo<\/b>. Cambio ruolo ogni 4'. Il maestro conta quante volte A resta sulla linea invece di arretrare di due metri.","blocks":{"att":["w1d2att0"],"pr":["w1d2pr0"],"sr":["w1d2sr0"],"ap":["w1d2ap0"]},"alts":[{"t":"Alternativa A · più controllata","x":"Maestro al cesto: due palle in diagonale, la terza variabile. Se è favorevole si cambia lungolinea, se è profonda si mantiene la diagonale."},{"t":"Alternativa B · due porte tattiche","x":"Punto a tutto campo con due zone segnate: profonda diagonale e lungolinea. La porta lungolinea si usa solo con equilibrio e anticipo; il bonus premia la scelta  del servizio, il maestro al cesto lancia una palla “di servizio” facile; poi rimanda una delle quattro risposte. Si lavora solo sul +1, senza la variabile del servizio."},{"t":"Alternativa B · le carte dei problemi","x":"Il maestro mostra alla chi risponde una carta (1–4) prima del servizio, senza che la battitrice la veda: chi risponde deve rispondere così, la battitrice deve risolverla."}]},{"title":"Pressione e chiusura","obj":"dopo aver creato il vantaggio, chiuderlo: andare avanti, prendere la palla prima che scenda e finire il punto nello spazio, senza fretta.","count":"Punti chiusi entro 4 colpi: vinti / persi (parte aperta).","kw":"creo, avanzo, chiudo nello spazio","filo":"<b>La seconda sotto punteggio.<\/b> Ogni giocatore gioca un game “solo seconde” contro il maestro: ogni seconda dentro nella metà profonda vale un punto, ogni doppio fallo ne toglie due. Routine fissa prima del servizio: respiro, palleggio della palla, bersaglio detto ad alta voce.","blocks":{"att":["w3d3att0"],"pr":["w3d3pr0"],"sr":["w3d3sr0"],"ap":["w3d3ap0"]},"alts":[{"t":"Alternativa A · più controllata","x":"Solo cesto, sequenza fissa di 3 palle: pressione da fondo, palla a metà campo, volée alta di chiusura. Poi il maestro cambia l’ordine."},{"t":"Alternativa B · chiudi in tre","x":"Punti da fondo: chi crea vantaggio ha solo tre colpi per chiudere. Se non chiude, il punto passa all’avversario. Insegna a non perdere tempo, ma anche a non forzare."}]},{"title":"Richiamo + match guidato","obj":"verificare se quello che abbiamo allenato compare da solo nel match. L’allenamento 5 serve soprattutto a osservare: nessuna nuova correzione tecnica.","count":"Prime di servizio nei bersagli su 10 (confronto con l’allenamento 1) + dati della Match Analysis.","kw":"","filo":"","blocks":{"att":["w3d4att0"],"ri":["w3d4ri0"],"sr":["w3d4sr0"],"ap":["w3d4ap0"]},"alts":[{"t":"Alternativa A · richiamo a stazioni","x":"Al posto delle 3 situazioni: 4 minuti per stazione su due campi — servizio +1, risposta in anticipo, chiusura al volo — con rotazione rapida."},{"t":"Alternativa B · set con piano di gioco","x":"Senza app: ogni giocatore sceglie un solo obiettivo della settimana e lo dichiara. Al cambio campo può tenerlo o cambiarlo, spiegando perché. Nessun bonus."}]}],"4":[{"title":"Approccio e prima volée","obj":"imparare i quattro passi dell’ingresso a rete e una prima volée di controllo, profonda, che prepara la chiusura.","count":"Prime volée profonde (oltre la linea del servizio) / totali.","kw":"approccio, split, prima volée","filo":"<b>La palla alta e carica.<\/b> Maestro al cesto, palle alte e lente. Tre risposte: <b>neutralizzo<\/b> (la rimando alta e profonda), <b>salgo<\/b> (entro e la prendo in salita), <b>al volo<\/b> (se arriva lenta a metà campo). Prima chiama il maestro, poi sceglie il giocatore.","blocks":{"att":["w4d0att0"],"pr":["w4d0pr0"],"sr":["w4d0sr0"],"ap":["w4d0ap0"]},"alts":[{"t":"Alternativa A · più controllata","x":"Solo cesto: serie di 6 volée (alta, bassa, larga a destra, larga a sinistra, alta, smash). Il giocatore parte dalla linea del servizio e avanza di un passo a ogni palla."},{"t":"Alternativa B · approccio in back","x":"Al posto dell’approccio coperto: back profondo lungolinea e avanti (in inglese “chip &amp; charge”). La palla bassa del back rende più difficile il passante."}]},{"title":"Servizio e rete","obj":"servire e scendere: avanzare fino alla linea del servizio, split, e una prima volée di controllo che apre il campo.","count":"Prime volée dopo il servizio giocate nello spazio giusto / totali.","kw":"servo, avanzo, split","filo":"<b>La seconda di servizio.<\/b> Solo seconde, con rotazione, su un bersaglio grande nella metà profonda del quadrato. Serie da 5: buona con 4 dentro su 5. Lancio sempre uguale, braccio che accelera anche sulla seconda.","blocks":{"att":["w4d1att0"],"pr":["w4d1pr0"],"sr":["w4d1sr0"],"ap":["w4d1ap0"]},"alts":[{"t":"Alternativa A · più controllata","x":"Serve &amp; volley senza risposta vera: dop const PROF = {"1":{"idea":"Comandare lo scambio da fondo, restare vicino alla linea quando possibile, togliere tempo e creare pressione <b>senza confondere aggressività con fretta<\/b>. Comandare non significa cercare prima il vincente: significa creare e mantenere vantaggio con profondità, tempo, direzioni e posizione in campo.","rows":[{"a":"Tattica","fa":"Prende l’iniziativa da fondo, vicino alla linea; usa profondità e direzioni per spostare; costruisce il punto attorno al suo colpo forte; tiene la pressione dopo aver creato vantaggio.","no":"Cambio di direzione troppo presto; accelerazione da palla neutra; vincente senza costruzione; perde campo dopo il colpo; diventa prevedibile."},{"a":"Tecnica","fa":"Colpi a rimbalzo solidi e penetranti; preparazione precoce; palla presa in salita; controllo di profondità e direzione; servizio e risposta propositivi.","no":"Qualità che cala se allontanata dalla linea; difficoltà sulle palle molto alte o molto basse; dipendenza dal solo diritto."},{"a":"Testa","fa":"Mentalità propositiva, energia, si prende la responsabilità del punto, resta aggressiva anche dopo un errore.","no":"Fretta e impazienza; frustrazione quando l’avversario resiste; “aggressiva” confuso con “tirare più forte”."},{"a":"Atletica","fa":"Primo passo rapido, accelerazioni brevi, frenata e ripartenza, appoggi stabili, recupero veloce tra azioni intense.","no":"Spostamenti poco efficienti → perde equilibrio e precisione; cala quando deve difendere o ripetere molte accelerazioni."}]},"2":{"idea":"Difendere non vuol dire subire. Il contrattaccante assorbe la pressione, <b>rimanda una palla in più<\/b>, riporta lo scambio in parità con altezza e profondità e sceglie il momento giusto per girare il punto. La regola della settimana è il <b>semaforo<\/b>: rosso difendo, giallo neutralizzo, verde contrattacco.","rows":[{"a":"Tattica","fa":"Non regala punti; neutralizza con palle alte, profonde e al centro-diagonale; legge quando l’avversario rallenta o accorcia; contrattacca in lungolinea o in anticipo.","no":"Troppo passiva; resta lontana dalla linea anche quando non serve; difende corta al centro; contrattacca prima di essere tornata in parità."},{"a":"Tecnica","fa":"Colpi in corsa e in apertura; palla alta e carica; back difensivo basso; passante e pallonetto; risposta di contenimento profonda.","no":"Colpo in corsa senza equilibrio; back che resta alto e corto; passante tirato a caso; poche soluzioni quando viene portata avanti."},{"a":"Testa","fa":"Pazienza, resilienza, spirito combattivo; accetta di difendere senza sentirsi “sotto”; trasforma la fatica dell’avversario in occasione.","no":"Si accontenta di rimandare; aspetta l’errore e non prende mai l’iniziativa; si scoraggia contro chi spinge forte."},{"a":"Atletica","fa":"Spostamenti laterali rapidi, passo incrociato, frenata e scivolata sulla terra, recupero veloce della posizione, resistenza ai recuperi ripetuti.","no":"Recupera sempre verso il centro anche quando non serve; cala di qualità dopo scambi lunghi; frenata in ritardo."}]},"3":{"idea":"Il punto si decide spesso nei <b>primi quattro colpi<\/b>: servizio, risposta, +1 della battitrice, +1 della chi risponde. L’Attacking Player usa servizio e risposta per prendere subito il comando e chiudere presto, ma <b>con uno schema, non con la fretta<\/b>: sa già dove andrà la palla dopo il servizio.","rows":[{"a":"Tattica","fa":"Ha schemi chiari al servizio e in risposta; crea vantaggio nei primi colpi; prende campo appena può e chiude presto, anche a rete.","no":"Attacca da palla neutra; poca pazienza se il punto si allunga; schemi sempre uguali e quindi prevedibili; nessun piano B."},{"a":"Tecnica","fa":"Servizio con direzioni e rotazioni diverse; risposta compatta, presa presto; +1 di diritto; volée e colpo al volo per chiudere.","no":"Seconda di servizio debole; preparazione lunga in risposta; +1 giocato senza equilibrio dopo il servizio."},{"a":"Testa","fa":"Decisa, sceglie prima del punto e si fida della scelta; accetta un rischio calcolato; resta aggressiva nei punti importanti.","no":"Impulsività; si innervosisce quando l’avversario rimanda tutto; scambia “veloce” per “aggressivo”."},{"a":"Atletica","fa":"Reattività, primi passi esplosivi, potenza di tronco e gambe, capacità di ripartire subito dopo il servizio o la risposta.","no":"Esce dal servizio in ritardo o sbilanciata; cala se costretta a scambi lunghi e ripetuti."}]},"4":{"idea":"Il gioco di rete si costruisce in quattro passi: <b>leggo la palla corta, approccio, split, prima volée<\/b>. A questa età non serve diventare giocatori di solo serve &amp; volley: serve sapere <b>quando<\/b> avanzare e cosa fare una volta lì. Più si è vicine alla rete, più è facile chiudere con angoli stretti.","rows":[{"a":"Tattica","fa":"Riconosce la palla per entrare; approccia profondo, spesso lungolinea; prima volée di controllo, seconda per chiudere; usa la rete per accorciare i punti.","no":"Entra da palla profonda o in ritardo; si ferma nella zona morta; cerca il vincente già con la prima volée."},{"a":"Tecnica","fa":"Approccio in back o coperto; split al momento del colpo avversario; volée corta e solida; smash; servizio con direzione per poter scendere.","no":"Volée con troppo movimento del braccio; smash senza posizionarsi; split in ritardo o assente."},{"a":"Testa","fa":"Coraggio e decisione; accetta di essere passata ogni tanto; legge l’avversario prima che colpisca.","no":"Paura del pallonetto; dopo un passante subito smette di venire avanti."},{"a":"Atletica","fa":"Accelerazione in avanti, frenata e split, reazione laterale, passi indietro per lo smash.","no":"Arriva a rete senza frenare; poca reattività laterale; arretramento goffo sul pallonetto."}]},"5":{"idea":"Ha tante soluzioni — cambio di ritmo, rotazioni, altezze, palla corta, rete — e le usa <b>con uno scopo<\/b>: spostare l’avversario, toglierle il ritmo, portarla avanti. La regola della settimana: <b>una variazione vale solo se cambia qualcosa nell’avversario<\/b>, altrimenti è decorazione.","rows":[{"a":"Tattica","fa":"Varia ritmo, altezza, profondità e larghezza in base all’avversario; usa la palla corta per portarla avanti; sa andare a rete per chiudere.","no":"Varia per abitudine o per noia; smorzata da dietro la linea; tante soluzioni e nessun piano."},{"a":"Tecnica","fa":"Top alto e carico, back basso, smorzata, cross stretto, volée; cambia rotazione nello stesso scambio.","no":"Back che galleggia; smorzata lunga; cross stretto senza margine sopra la rete."},{"a":"Testa","fa":"Creatività e lettura dell’avversario; le piace risolvere problemi.","no":"Si distrae; cerca il colpo bello invece di quello utile."},{"a":"Atletica","fa":"Coordinazione, equilibrio dinamico, cambi di direzione in tutte le direzioni, avanti-indietro.","no":"Arriva tardi sulle palle corte; perde equilibrio nei cambi di direzione."}]},"6":{"idea":"L’universale non ha un solo modo di giocare: <b>riconosce la fase del punto e cambia comportamento<\/b> — difende, costruisce, pressa, attacca, va a rete. È la settimana che chiude il primo ciclo: <b>più leggera<\/b>, pochi contenuti nuovi, molta osservazione, il <b>test intermedio<\/b> e il questionario per i ragazzi.","rows":[{"a":"Tattica","fa":"Riconosce difesa, costruzione, pressione, attacco; passa da una fase all’altra nello stesso punto; si adatta all’avversario.","no":"Gioca sempre allo stesso modo, qualunque sia la palla; cambia fase troppo presto o troppo tardi."},{"a":"Tecnica","fa":"Ha almeno una soluzione affidabile per ogni fase del punto.","no":"Una fase scoperta (spesso la difesa o la rete)."},{"a":"Testa","fa":"Lucidità, sa spiegare cosa sta succedendo; si adatta senza innervosirsi.","no":"Si blocca quando il piano A non funziona."},{"a":"Atletica","fa":"Agilità reattiva: percepire, decidere, muoversi.","no":"Si muove bene sugli schemi conosciuti, male sugli imprevisti."}]},"7":{"idea":"Secondo ciclo: si torna all’attaccante da fondo, ma ora ogni giocatore lavora sulla <b>sua<\/b> arma — quella emersa dal test della settimana 6 — e decide da solo quando pressare. Meno chiamate del maestro, più punteggio, avversari che cambiano il gioco apposta.","rows":[{"a":"Tattica","fa":"Costruisce il punto attorno alla propria arma; sceglie da solo quando passare a pressione; cambia schema se l’avversario lo legge.","no":"Cerca l’arma dal nulla, anche su palla sbagliata; usa sempre lo stesso schema."},{"a":"Tecnica","fa":"Arma affidabile anche sotto pressione; colpo di costruzione che porta la palla giusta all’arma.","no":"Arma solida solo in allenamento chiuso; colpo di costruzione debole."},{"a":"Testa","fa":"Fiducia nella propria arma nei punti importanti; accetta l’errore se la scelta era giusta.","no":"Usa l’arma solo quando è in vantaggio; la abbandona dopo due errori."},{"a":"Atletica","fa":"Primo passo reattivo, accelerazione e frenata su stimoli imprevisti.","no":"Si muove bene solo su percorsi conosciuti."}]},"8":{"idea":"Il semaforo ora non lo chiama più nessuno: il contrattaccante deve riconoscere da solo la palla rossa, gialla e verde e soprattutto <b>non contrattaccare prima del verde<\/b>. Si aggiungono le variazioni difensive (back, palla alta) e il punteggio sotto pressione.","rows":[{"a":"Tattica","fa":"Riconosce da solo il livello di difficoltà della palla; neutralizza variando; contrattacca solo quando la palla perde peso; usa passante e pallonetto in modo ragionato.","no":"Contrattacca da posizione difensiva; difende sempre con lo stesso colpo; si accontenta di rimandare."},{"a":"Tecnica","fa":"Back difensivo basso, top alto e carico, colpo in corsa che diventa contrattacco, passante incrociato stretto.","no":"Back che galleggia; colpo in corsa senza equilibrio; passante sempre nella stessa direzione."},{"a":"Testa","fa":"Lucidità sotto punteggio difficile (0-30, 30-40); pazienza attiva.","no":"Si innervosisce quando è sotto; cerca il colpo impossibile."},{"a":"Atletica","fa":"Recuperi lunghi e ripartenza, cambi di direzione ripetuti, frenata e scivolata.","no":"Cala dopo scambi lunghi; recupera la posizione in ritardo."}]},"9":{"idea":"Gli schemi dei primi quattro colpi ora si giocano <b>sotto punteggio reale<\/b>. L’obiettivo è creare vantaggio subito anche nei punti che pesano, senza forzare: scegliere lo schema giusto per quel punteggio e per quell’avversario.","rows":[{"a":"Tattica","fa":"Sceglie lo schema in base al punteggio e all’avversario; attacca la seconda con decisione; chiude presto senza regalare.","no":"Stesso schema a ogni punto; rischio eccessivo nei punti importanti."},{"a":"Tecnica","fa":"Servizio con 2–3 varianti affidabili; risposta in anticipo; +1 aggressivo ma con margine.","no":"Seconda che cala sotto pressione; +1 sbilanciato."},{"a":"Testa","fa":"Routine stabile tra i punti; coraggio nei punti importanti.","no":"Fretta quando è in vantaggio, paura quando è sotto."},{"a":"Atletica","fa":"Potenza breve, reazione, uscita dal servizio esplosiva anche con un po’ di fatica.","no":"Esplosività che cala nel corso della seduta."}]},"10":{"idea":"Nel secondo ciclo la rete diventa una <b>scelta<\/b>: entrare solo sulla palla giusta, leggere passante e pallonetto senza sequenze fisse, occupare la rete con lo split. E restare a fondo, quando è il caso, è una decisione corretta quanto entrare.","rows":[{"a":"Tattica","fa":"Entra solo su palla attaccabile; prima volée che mette in difficoltà; legge il pallonetto; sa restare a fondo quando serve.","no":"Entra sempre o mai; si ferma a metà campo; chiude troppo presto sulla prima volée."},{"a":"Tecnica","fa":"Approccio profondo, split in tempo, volée bassa di controllo, smash con passi indietro.","no":"Volée bassa giocata forte e in rete; smash da fermi."},{"a":"Testa","fa":"Decisione rapida, fiducia nella rete anche dopo un passante subito.","no":"Esita a metà strada; dopo un pallonetto smette di venire avanti."},{"a":"Atletica","fa":"Avanti-indietro reattivo, split, frenata e nuova partenza.","no":"Arriva a rete sbilanciata; recupero sul pallonetto lento."}]},"11":{"idea":"Le variazioni della settimana 5 ora si scelgono <b>guardando l’avversario<\/b>: chi sta lontana, chi sta vicina, chi è lenta, chi è aggressiva. Si osserva, si sceglie, si verifica, si aggiorna il piano: è la settimana che prepara l’universale finale.","rows":[{"a":"Tattica","fa":"Trova in pochi punti il punto debole dell’avversario; sceglie la variazione che lo sfrutta; aggiorna il piano.","no":"Varia senza guardare l’avversario; insiste con una variazione che non funziona."},{"a":"Tecnica","fa":"Tutte le variazioni della settimana 5 disponibili anche sotto pressione.","no":"Variazioni che reggono solo a ritmo basso."},{"a":"Testa","fa":"Curiosità, osservazione, pazienza nel costruire il piano.","no":"Si innamora di un colpo e non lo cambia."},{"a":"Atletica","fa":"Coordinazione complessa, cambi di direzione su stimolo, orientamento nello spazio.","no":"Perde orientamento quando il punto cambia direzione spesso."}]},"12":{"idea":"Ultima settimana: si mettono insieme le sei identità, si ripete il test della settimana 6 e si costruisce il <b>profilo individuale<\/b> di ogni giocatore. Settimana <b>più leggera<\/b>: pochi contenuti nuovi, molta osservazione, e il confronto tra quello che la ragazza pensa di sé e quello che dicono i numeri.","rows":[{"a":"Tattica","fa":"Passa da un’identità all’altra nello stesso punto; ha un piano A e un piano B.","no":"Una sola identità disponibile; nessun piano B."},{"a":"Tecnica","fa":"Almeno una soluzione affidabile per fase; arma chiara.","no":"Una fase del punto ancora scoperta."},{"a":"Testa","fa":"Sa descrivere il proprio gioco: cosa preferisce, cosa funziona, cosa evita.","no":"Differenza grande tra come si vede e come gioca."},{"a":"Atletica","fa":"Agilità reattiva situazionale: qualità della scelta e del movimento.","no":"Buoni tempi nei test, ma movimento lento nelle situazioni nuove."}]}};

/* ---------- scoring engine ---------- */
function newState(f){
  const st = {sets:[], g:[0,0], p:[0,0], tb:null, server:f.first, done:null, won:[0,0]};
  if(f.type!=='set') st.tb = {target: f.type==='tb7'?7:10, first:f.first, whole:true};
  return st;
}
function tbServer(st){ const n = st.p[0]+st.p[1]; if(n===0) return st.tb.first; return Math.floor((n-1)/2)%2===0 ? 1-st.tb.first : st.tb.first; }
function curServer(st){ return st.tb ? tbServer(st) : st.server; }
function setWon(f, st, w){
  st.won[w]++; st.g=[0,0];
  const need = f.sets===3 ? 2 : 1;
  if(st.won[w]>=need){ st.done=w; return; }
  if(f.sets===3 && st.won[0]===1 && st.won[1]===1 && f.decider==='tb10') st.tb = {target:10, first:st.server, decider:true};
}
function applyPoint(f, st, w){
  if(st.done!==null) return;
  const o = 1-w;
  if(st.tb){
    st.p[w]++;
    if(st.p[w]>=st.tb.target && st.p[w]-st.p[o]>=2){
      const tb = st.tb, sc = [...st.p];
      st.p=[0,0]; st.tb=null;
      if(tb.whole){ st.sets.push({a:sc[0], b:sc[1]}); st.won[w]++; st.done=w; }
      else if(tb.decider){ st.sets.push({a:sc[0], b:sc[1], stb:true}); st.won[w]++; st.done=w; }
      else { st.g[w]++; st.sets.push({a:st.g[0], b:st.g[1], tb:Math.min(sc[0],sc[1])}); st.server = 1-tb.first; setWon(f, st, w); }
    }
    return;
  }
  st.p[w]++;
  const gameWon = f.ad ? (st.p[w]>=4 && st.p[w]-st.p[o]>=2) : st.p[w]>=4;
  if(!gameWon) return;
  st.p=[0,0]; st.g[w]++; st.server = 1-st.server;
  const G = f.games, gw = st.g[w], go = st.g[o];
  if(gw>=G && gw-go>=2){ st.sets.push({a:st.g[0], b:st.g[1]}); setWon(f, st, w); }
  else if(f.tb && st.g[0]===G && st.g[1]===G) st.tb = {target:7, first:st.server};
}
function replay(m){ const st = newState(m.format); m.points.forEach(p=>applyPoint(m.format, st, p.w)); return st; }
function isPressure(f, st){
  if(st.done!==null) return false;
  const [a,b] = st.p;
  if(st.tb){ const t = st.tb.target; return (a>=t-2 && b>=t-2) || (Math.max(a,b)>=t-1 && Math.abs(a-b)<=1); }
  if(!f.ad && a===3 && b===3) return true;
  return (a>=3 && b>=2) || (b>=3 && a>=2);
}
function ptLabel(f, st, i){
  if(st.tb) return String(st.p[i]);
  const me = st.p[i], ot = st.p[1-i];
  if(me>=3 && ot>=3){ if(me===ot) return '40'; return me>ot ? 'V' : '40'; }
  return ['0','15','30','40'][Math.min(me,3)];
}
function statusTags(f, st){
  const t = [];
  if(st.done!==null) return [['Partita finita','hot']];
  if(st.tb) t.push([st.tb.decider ? 'Super tie-break' : 'Tie-break', '']);
  else if(!f.ad && st.p[0]===3 && st.p[1]===3) t.push(['Killer point','hot']);
  else if(st.p[0]>=3 && st.p[1]>=3 && st.p[0]===st.p[1]) t.push(['Parità','']);
  if(isPressure(f, st)) t.push(['Punto importante','hot']);
  return t;
}
function formatLabel(f){
  if(f.type==='tb7') return 'Tie-break a 7';
  if(f.type==='tb10') return 'Tie-break a 10';
  let s = (f.sets===1 ? '1 set' : '2 set su 3') + ' a ' + f.games + ' game';
  s += f.tb ? ', tie-break sul ' + f.games + '-' + f.games : ', senza tie-break';
  if(f.sets===3) s += f.decider==='tb10' ? ', 3° set super tie-break' : '';
  return s + (f.ad ? ', con vantaggi' : ', killer point');
}
function scoreLine(st){ const l = st.sets.map(x=> x.stb ? `[${x.a}-${x.b}]` : `${x.a}-${x.b}${x.tb!==undefined?`(${x.tb})`:''}`); if(st.done===null && (st.g[0]||st.g[1])) l.push(`${st.g[0]}-${st.g[1]}`); return l.join('  '); }

/* ---------- stats ---------- */
function matchStats(m){
  const n = m.choices.length;
  const rows = m.choices.map((label,i)=>({label, n:0, ex:0, exn:0, won:0, prn:0, prw:0}));
  const none = {label:'Nessuna scelta', n:0, won:0, prn:0, prw:0, ex:0, exn:0};
  let won=0, srv=0, srvW=0, ret=0, retW=0, prn=0, prw=0;
  m.points.forEach(p=>{
    const r = p.ch===null || p.ch===undefined ? none : rows[p.ch];
    if(!r) return;
    const w = p.w===0;
    r.n++; if(w){ r.won++; won++; }
    if(p.ex!==null && p.ex!==undefined){ r.exn++; if(p.ex) r.ex++; }
    if(p.pr){ r.prn++; prn++; if(w){ r.prw++; prw++; } }
    if(p.srv===0){ srv++; if(w) srvW++; } else { ret++; if(w) retW++; }
  });
  return {rows, none, tot:m.points.length, won, srv, srvW, ret, retW, prn, prw};
}
function mergeStats(list){
  const by = {};
  list.forEach(m=>{ const s = matchStats(m); s.rows.forEach(r=>{ const k = r.label; by[k] = by[k] || {label:k, n:0, won:0, ex:0, exn:0, prn:0, prw:0}; ['n','won','ex','exn','prn','prw'].forEach(f=>by[k][f]+=r[f]); }); });
  return Object.values(by).filter(r=>r.n>0).sort((a,b)=>b.n-a.n);
}

function ppGroup(aid){ const a = ath(aid); if(!a) return undefined; const pv = privOf(aid); if(!pv.pg) return undefined; pv.pg.name = a.name; return pv.pg; }

const isStaff = r => r==='coach' || r==='fit' || r==='mind';
const ROLE_NAME = {fit:'Preparatore atletico', mind:'Preparatore mentale'};
/* sessions are numbered 1–5: the coach ticks each one when it is done, so a missed day can be made up on any other day */
const gwk = g => isOwnG(g) ? 'o'+ownOf(g.id).cur : String(g.week);
const sDone = g => ((g && g.sdone) || {})[gwk(g)] || {};
const doneDate = (g,di) => sDone(g)[di] || '';
/* how many sessions a week the group trains: with the 12-week programme fewer sessions keep the first and the last (the comparison of the prova) */
const PICK12 = {2:[0,4], 3:[0,2,4], 4:[0,1,2,4], 5:[0,1,2,3,4]};
const nS = g => g && g.pp ? Math.min(5, Math.max(1, g.freq || 1)) : Math.min(5, Math.max(2, (g && g.freq) || 5));
const pickOf = g => isOwnG(g) ? [0,1,2,3,4].slice(0, nS(g)) : PICK12[nS(g)];
const sNo = (g,di) => pickOf(g).indexOf(di) + 1;
const sLabel = (g,di) => 'Allenamento ' + (sNo(g,di) || di+1);
function curIdx(g){ if(!g || g.id===PRIV_ID) return -1; const m = sDone(g), t = todayISO(), pk = pickOf(g); for(const i of pk.slice().reverse()) if(m[i]===t) return i; for(const i of pk) if(!m[i]) return i; return -1; }
function nextFree(g){ const m = sDone(g); for(const i of pickOf(g)) if(!m[i]) return i; return -1; }
function todayIdx(g){ if(g){ const i = curIdx(g), pk = pickOf(g); return i<0 ? pk[pk.length-1] : i; } const d = new Date().getDay(); return d>=1 && d<=5 ? d-1 : 4; }
function sessDots(g){ const m = sDone(g), pk = pickOf(g); return `<span class="sdots" aria-label="${pk.filter(i=>m[i]).length} allenamenti su ${pk.length} fatti">${pk.map((i,k)=>`<i class="${m[i]?'on':''}">${k+1}</i>`).join('')}</span>`; }
function sessBtns(g, di){ if(S.session.role!=='coach' || !g) return '';
  if(nextFree(g)<0) return `<div class="note"><b>Settimana completata.</b> Tutti e ${pickOf(g).length} gli allenamenti sono fatti.</div><button class="btn clay" data-a="weeknext" data-k="${g.id}">Passa alla settimana ${isOwnG(g)?ownOf(g.id).cur+1:Math.min(12,g.week+1)}</button>`;
  const dd = doneDate(g,di), nx = nextFree(g);
  return dd ? `<div class="row"><button class="btn ghost" data-a="sessdone" data-k="${g.id}:${di}" style="flex:1">✓ Fatto ${dd===todayISO()?'oggi':fdate(dd)} · annulla</button>${nx>=0?`<button class="btn ghost" data-a="sessdone" data-k="${g.id}:${nx}" style="flex:1">Oggi anche il ${sNo(g,nx)} (recupero)</button>`:''}</div>` : `<button class="btn" data-a="sessdone" data-k="${g.id}:${di}">Segna l'allenamento ${sNo(g,di)} come fatto</button>`; }
const sessHead = (g, di, title) => nextFree(g)<0 ? 'Settimana completata ✓' : `${sLabel(g,di)}: ${title}`;

  const ms = S.matches.filter(m=>m.done && (m.a.id===id));
  const merged = mergeStats(ms.filter(m=>m.mode!=='task'));
  const tms = ms.filter(m=>m.mode==='task');
  const tw = TEST_WEEKS.filter(n=>S.tests.some(x=>x.athleteId===id&&x.week===n));
  const tabs = role==='parent' ? ATABS.slice(0,3) : role==='fit' ? ATABS.slice(0,3) : role==='mind' ? [ATABS[0],ATABS[2],ATABS[3]] : ATABS;

/* own programmes: d.ex = exercise ids, d.exPh = the group phase each one is placed in */
function mapPh(g, e){ const w = lessonOf(g).phases.filter(p=>!p.pause); if(!w.length) return (e && e.ph) || 'pr'; const k = e ? (e.ph==='ri'?'pr':e.ph) : ''; return w.some(p=>p.k===k) ? k : w[0].k; }
function ownPh(g, d, i){ return (d.exPh && d.exPh[i]) || mapPh(g, exById(d.ex[i])); }

function ownByPhase(g, d, render, adders){
  const L = lessonOf(g), items = ownItems(g, d);

}

const fdate = d => new Date(d).toLocaleDateString('it-IT',{day:'numeric',month:'short'});

function tipoResult(ans, tq){
  tq = tq || defTpl('tipo').tq; const c = {}; TYPES.forEach(t=>c[t[0]]=0);
  Object.entries(ans).forEach(([i,o])=>{ const q = tq[+i]; if(q && q.o[o] && c[q.o[o].ty]!==undefined) c[q.o[o].ty]++; });
  const order = TYPES.map(t=>t[0]).sort((a,b)=>c[b]-c[a]);
  return {c, first:order[0], second:order[1]};
}
const tname = k => TYPES.find(t=>t[0]===k)[1];
const tipoOf = f => tipoResult(f.ans, tplOf(f).tq);
function tipoBars(ans, tq){
  tq = tq || defTpl('tipo').tq; const r = tipoResult(ans, tq), N = tq.length || 1;
  return `<div class="bars">${TYPES.map(([k,n])=>`<div class="bar"><div class="lab"><span>${n}</span><span>${r.c[k]} su ${N}</span></div><div class="track"><div class="fill" style="width:${r.c[k]/N*100}%;background:${tcol(k)}"></div></div></div>`).join('')}</div>`;
}

    <button class="btn clay block" data-a="edsave">${E.ctx?'Salva e metti nella seduta':'Salva nella libreria'}</button>`;
}
function arrowPath(x1,y1,x2,y2,curve){
  if(!curve) return `M${x1} ${y1}L${x2} ${y2}`;
  const mx=(x1+x2)/2, my=(y1+y2)/2, dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1, k=.18*len;
  let nx=-dy/len, ny=dx/len; if(ny>0){ nx=-nx; ny=-ny; }
  return `M${x1} ${y1}Q${(mx+nx*k).toFixed(1)} ${(my+ny*k).toFixed(1)} ${x2} ${y2}`;
}

function taskStats(list){
  const by = {};
  list.forEach(m=>{ m.points.filter(p=>!p.empty).forEach(p=>p.t.forEach(i=>{ const k = m.tasks[i]; by[k] = by[k] || {label:k, n:0, won:0, known:0}; by[k].n++; if(p.w!==null&&p.w!==undefined){ by[k].known++; if(p.w===0) by[k].won++; } })); });
  return Object.values(by).sort((a,b)=>b.n-a.n);
}

/* ---------- dates ---------- */
const todayISO = () => { const d = new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const MONTHS = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const dLabel = iso => { const d = new Date(iso+'T12:00'); return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3); };
function firstMonday(y){ const j1 = new Date(Date.UTC(y,0,1)); const add = (8 - j1.getUTCDay()) % 7; return new Date(Date.UTC(y,0,1+add)); }
function weekMonday(year, n){ return new Date(firstMonday(year).getTime() + (n-1)*7*864e5).toISOString().slice(0,10); }
function weekOf(iso){ const t = new Date(iso+'T00:00Z'); let y = t.getUTCFullYear(); if(t < firstMonday(y)) y--; return {year:y, n:1+Math.floor((t-firstMonday(y))/(7*864e5))}; }

const myRes = () => { const x = tByKey(U.tOpen); const id = me().id; x.t.results = x.t.results || {}; return (x.t.results[id] = x.t.results[id] || {}); };
const wtype = k => WTYPES.find(t=>t[0]===k) || WTYPES[0];
function seasonOf(y){ S.season = S.season || {}; return S.season[y] = S.season[y] || {weeks:{}}; }
function weekData(y,n){ const s = seasonOf(y); return s.weeks[n] = s.weeks[n] || {type:'', t:[], note:''}; }
const addDays = (iso,n) => { const d = new Date(iso+'T12:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
function tSpan(t,y,n){ const mon = weekMonday(y,n), st = t.start || mon; let en = t.end || addDays(mon,6); if(en < st) en = st; return [st,en]; }
const isAlt = x => x.i>0 && !x.t.solo;
const TROLES = [['main','1ª scelta'],['alt','Alternativa'],['extra','Torneo in più']];
const tRole = x => x.i===0 ? 'main' : x.t.solo ? 'extra' : 'alt';
const roleSeg = (k, cur) => `<div class="seg" role="group" aria-label="Ruolo nella settimana">${TROLES.map(([r,l])=>`<button data-a="trole" data-k="${k}" data-v="${r}" aria-pressed="${cur===r}">${l}</button>`).join('')}</div>`;
function setTourRole(k, role){
  const x = tByKey(k); if(!x) return k; const w = weekData(x.y,x.n), t = x.t;
  const oldMain = x.i!==0 && w.t[0] && w.t[0].name ? w.t[0] : null;
  const others = w.t.filter((z,i)=>i!==x.i && i!==0 && z.name);
  const blank = {name:'',kind:'',deadline:'',info:'',players:[],results:{}};
  let arr;
  if(role==='main'){ t.solo = false; if(oldMain) oldMain.solo = false; arr = [t, ...(oldMain?[oldMain]:[]), ...others]; }
  else { t.solo = role==='extra'; arr = [oldMain || blank, ...others, t]; }
  w.t = arr; if(!w.type) w.type = 'comp';
  return `${x.y}:${x.n}:${arr.indexOf(t)}`;
}
function setTourDates(k, st, en){
  const x = tByKey(k); if(!x) return k; const t = x.t;
  if(!st){ delete t.start; delete t.end; return k; }
  const wo = weekOf(st), mon = weekMonday(wo.year, wo.n);
  if(en && en < st) en = st;
  if(st===mon && (!en || en===addDays(mon,6))){ delete t.start; delete t.end; } else { t.start = st; if(en) t.end = en; else delete t.end; }
  if(wo.year===x.y && wo.n===x.n) return k;
  const src = weekData(x.y,x.n).t; if(x.i===0 && src.length>1) src[0] = {name:'',kind:'',deadline:'',info:'',players:[],results:{}}; else src.splice(x.i,1);
  const dst = weekData(wo.year, wo.n); if(!dst.type) dst.type = 'comp';
  let i; if(dst.t[0] && !dst.t[0].name){ dst.t[0] = t; i = 0; } else { t.solo = true; dst.t.push(t); i = dst.t.length-1; }
  return `${wo.year}:${wo.n}:${i}`;
}
function allTournaments(){
  const out = [];
  Object.entries(S.season||{}).forEach(([y,s])=>Object.entries(s.weeks).forEach(([n,w])=>(w.t||[]).forEach((t,i)=>{ if(t.name){ const [st,en] = tSpan(t,+y,+n); out.push({y:+y, n:+n, i, t, date:st, end:en}); } })));
  return out.sort((a,b)=>a.date<b.date?-1:1);

/* ---------- length and phases of a training session, per group ---------- */
const DEF_PHASES = () => [{k:'att',n:'Attivazione',m:13},{k:'p1',n:'Pausa',m:4,pause:true},{k:'pr',n:'Fase centrale',m:28},{k:'p2',n:'Pausa',m:3,pause:true},{k:'filo',n:'Filo fisso',m:10},{k:'sr',n:'Servizio e risposta',m:17},{k:'ap',n:'Parte aperta · partita',m:30}];
const PHCOL = {att:'#5B6068', pr:'#3B6FD8', ri:'#3B6FD8', filo:'#8A6200', sr:'#0E6670', ap:'#B4532A'};
const XCOL = ['#7A4FB0','#1F8A7A','#9A7400','#C4622D','#5A6270'];
const lessonOf = g => (g && g.lesson) || {dur:105, phases:DEF_PHASES()};
const ensureLesson = g => { if(!g.lesson) g.lesson = {dur:105, phases:DEF_PHASES()}; return g.lesson; };

const durTxt = m => { const h = Math.floor(m/60), r = m%60; return h ? `${h} h${r?' '+r+"'":''}` : `${r}'`; };
let CUR_LG = null;
const getLG = () => CUR_LG || grp(U.planGroup) || teamGroups()[0] || null;
function phInfo(k){
  const L = lessonOf(getLG()), kk = k==='ri' ? 'pr' : k, i = L.phases.findIndex(x=>x.k===kk), p = L.phases[i];
  if(p) return [k==='ri' && p.n==='Fase centrale' ? 'Richiamo' : p.n, phColor(p,i), p.m ? p.m+"'" : ''];
  if(PH[k]) return [PH[k][0], PH[k][1], L.phases.length ? PH[k][2] : ''];
  return ['Esercizio','#5A6270',''];
}
const noLesson = g => !lessonOf(g).phases.length;
const NEUTRAL = () => ['att','pr','filo','sr','ap'].map(k=>({k, n:k==='filo'?'Filo fisso':PH[k][0], m:0}));
const workPhases = g => { const w = lessonOf(g).phases.filter(p=>!p.pause && p.k!=='filo'); return w.length ? w : ['att','pr','sr','ap'].map(k=>({k, n:PH[k][0], m:0})); };
function lessonTL(g, fri){
  const L = lessonOf(g); if(!L.phases.length) return `<p class="small muted">Durata e fasi dell'allenamento non ancora impostate${g?' per '+esc(g.name):''}.</p>`; let ph = L.phases.map((p,i)=>({...p, c:phColor(p,i)}));
  if(fri){ const f = ph.find(p=>p.k==='filo'); ph = ph.filter(p=>p.k!=='filo'); const a = ph.find(p=>p.k==='ap'); if(f && a) a.m += f.m; ph.forEach(p=>{ if(p.k==='pr' && p.n==='Fase centrale') p.n='Richiamo'; if(p.k==='ap' && p.n==='Parte aperta · partita') p.n='Match guidato'; }); }
  const tot = ph.reduce((t,p)=>t+(+p.m||0),0);

    <p class="small muted">${durTxt(tot)} · ${ph.filter(p=>!p.pause).map(p=>`${esc(p.n)} ${p.m}'`).join(' · ')}</p>`;
}
const sortByPhase = (g, exs) => { const ord = lessonOf(g).phases.map(p=>p.k); const ix = e => { const i = ord.indexOf(e.ph==='ri'?'pr':e.ph); return i<0 ? 99 : i; }; return exs.slice().sort((a,b)=>ix(a)-ix(b)); };
function lessonEditor(g){
  const L = ensureLesson(g), tot = L.phases.reduce((t,p)=>t+(+p.m||0),0), diff = (L.dur && L.phases.length) ? tot - L.dur : 0;
  return `<button class="btn ghost" data-a="lessonclose" style="align-self:flex-start">‹ Programma di ${esc(g.name)}</button>

      ${!L.phases.length?'<p class="small muted">Nessuna fase: aggiungi le fasi del tuo allenamento con "+ Fase" e "+ Pausa".</p>':''}<p class="small ${diff?'':'muted'}" style="${diff?'color:var(--ko);font-weight:600':''}">Totale ${tot} minuti${diff?` · ${diff>0?diff+' in più':(-diff)+' in meno'} rispetto a ${L.dur}`:(L.dur&&L.phases.length?' · torna con la durata':'')}</p>

    ${teamGroups().length>1?`<section class="card"><h3>Usala anche per altri gruppi</h3><div class="row" style="gap:6px">${teamGroups().filter(x=>x.id!==g.id).map(x=>`<button class="chip" data-a="lessoncopy" data-k="${x.id}">${esc(x.name)}</button>`).join('')}</div></section>`:''}`;
}
function lessonSnap(){ const g=grp(U.lessonEd); if(!g) return; U.lessonUndo=U.lessonUndo||[]; U.lessonUndo.push(JSON.parse(JSON.stringify(ensureLesson(g)))); if(U.lessonUndo.length>30) U.lessonUndo.shift(); }
function scalePhases(L, newDur){ if(!L.phases.length){ L.dur = newDur; return; } const tot = L.phases.reduce((t,p)=>t+(+p.m||0),0) || 1; L.phases.forEach(p=>{ p.m = Math.max(p.pause?2:5, Math.round(p.m*newDur/tot)); }); const t2 = L.phases.reduce((t,p)=>t+p.m,0), big = L.phases.filter(p=>!p.pause).sort((a,b)=>b.m-a.m)[0]; if(big) big.m += newDur - t2; L.dur = newDur; }

/* ---------- tournaments v2: simple cards, calendar strip, requests ---------- */
const tKey = x => `${x.y}:${x.n}:${x.i}`;
const tByKey = k => { const [y,n,i] = k.split(':').map(Number); const w = (seasonOf(y).weeks||{})[n]; const t = w && w.t[i]; if(!t) return null; const [st,en] = tSpan(t,y,n); return {y,n,i,t,date:st,end:en}; };

}

/* ---------- paste-to-fill: read a tournament from pasted text or link ---------- */
const MON_ALL = {gen:1,jan:1,feb:2,mar:3,apr:4,mag:5,may:5,giu:6,jun:6,lug:7,jul:7,ago:8,aug:8,set:9,sep:9,ott:10,oct:10,nov:11,dic:12,dec:12};
function parseTournament(txt){
  const out = {name:'', date:'', deadline:'', info:'', cat:''};
  const raw = (txt||'').trim(); if(!raw) return out;
  const url = (raw.match(/https?:\/\/\S+/)||[])[0] || '';
  const iso = (y,m,d) => { y = +y; if(y<100) y += 2000; const s = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; return isNaN(new Date(s+'T12:00')) ? '' : s; };
  const found = []; const spans = [];
  const free = (i,len) => !spans.some(([a,b])=>i<b && i+len>a);
  const push = (pos, len, d) => { if(d && free(pos,len)){ found.push({pos, date:d}); spans.push([pos,pos+len]); } };
  const guessY = (mo, d) => { const now = new Date(); let y = now.getFullYear(); const t = new Date(y, mo-1, d); if(t < new Date(now.getTime()-45*864e5)) y++; return y; };
  const mon = w => MON_ALL[(w||'').slice(0,3).toLowerCase()];
  let m;
  const R = [
    [/\b(\d{4})-(\d{2})-(\d{2})\b/g, m=>iso(m[1],m[2],m[3])],
    [/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/g, m=>iso(m[3],m[2],m[1])],
    [/\b(\d{1,2})(?:\s*[-–\/]\s*\d{1,2})?\s+([A-Za-zàéì]{3,})\.?,?\s+(\d{4})\b/g, m=>mon(m[2])?iso(m[3],mon(m[2]),m[1]):''],
    [/\b([A-Za-z]{3,})\.?\s+(\d{1,2})(?:\s*[-–]\s*(?:[A-Za-z]{3,}\.?\s+)?\d{1,2})?,?\s+(\d{4})\b/g, m=>mon(m[1])?iso(m[3],mon(m[1]),m[2]):''],
    [/\b(\d{1,2})(?:\s*[-–\/]\s*\d{1,2})?\s+([A-Za-zàéì]{3,})\b\.?/g, m=>mon(m[2])?iso(guessY(mon(m[2]),+m[1]),mon(m[2]),m[1]):''],
    [/\b([A-Za-z]{3,})\.?\s+(\d{1,2})\b(?!\s*[:.]\d)/g, m=>mon(m[1])?iso(guessY(mon(m[1]),+m[2]),mon(m[1]),m[2]):''],
    [/\b(\d{1,2})[\/.](\d{1,2})\b(?![\/.]\d)/g, m=>(+m[2]>=1&&+m[2]<=12&&+m[1]<=31)?iso(guessY(+m[2],+m[1]),m[2],m[1]):'']
  ];
  R.forEach(([re,fn])=>{ re.lastIndex=0; while((m = re.exec(raw))) push(m.index, m[0].length, fn(m)); });
  found.sort((a,b)=>a.pos-b.pos);
  // deadline: a date within ~60 chars after a deadline keyword
  const kw = /(entry\s*deadline|deadline|closing date|entries close|entry closes|scadenza|termine iscrizion\w*|iscrizion[ei]\s*(entro|chiusura)?|chiusura iscrizioni|withdrawal|sign[\s-]*in)/ig;
  let dl = null; while((m = kw.exec(raw))){ const f = found.find(x=>x.pos>=m.index && x.pos<=m.index+80); if(f){ dl = f; break; } }
  if(dl) out.deadline = dl.date;
  const rest = found.filter(x=>x!==dl).map(x=>x.date).sort();
  if(rest.length) out.date = rest[0];
  // category
  const cat = raw.match(/super\s*category|category\s*[1-3]|cat\.?\s*[1-3]|\b(1[2-8])\s*(&|and|e)?\s*(under|U)\b|\bU\s?1[2-8]\b|under\s*1[2-8]/ig);
  if(cat) out.cat = [...new Set(cat.map(c=>c.replace(/\s+/g,' ').trim()))].slice(0,3).join(' · ');
  // name: first meaningful line, else from link
  const MONRE = '(?:gen|jan|feb|mar|apr|mag|may|giu|jun|lug|jul|ago|aug|set|sep|ott|oct|nov|dic|dec)[a-zàéì]*\\.?';
  const strip = l => l.replace(/https?:\/\/\S+/g,'')
    .replace(/\b\d{4}-\d{2}-\d{2}\b/g,'').replace(/\b\d{1,2}[\/.\-]\d{1,2}([\/.\-]\d{2,4})?\b/g,'')
    .replace(new RegExp('\\b\\d{1,2}(\\s*[-–\\/]\\s*\\d{1,2})?\\s+'+MONRE+'(,?\\s+\\d{4})?','ig'),'')
    .replace(new RegExp('\\b'+MONRE+'\\s+\\d{1,2}\\b(,?\\s+\\d{4})?','ig'),'')
    .replace(/\b(entry\s*deadline|deadline|closing date|entries close|entry closes|scadenza( iscrizioni)?|termine iscrizion\w*|tournament dates?|dates?|dal|al|ore|surface|superficie)\b\s*:?/ig,'')
    .replace(/\b\d{1,2}[:.]\d{2}\b/g,'').replace(/[|•]/g,' ').replace(/\s[-–]\s/g,' ').replace(/\s{2,}/g,' ').replace(/^[\s:·,\-–]+|[\s:·,\-–]+$/g,'').trim();
  const generic = /^(tennis europe( junior tour)?|junior tour|tournament( details| info)?|home|menu|calendar|calendario|tornei)$/i;
  const lines = raw.split(/\n+/).map(strip).filter(l=>l.length>3 && l.length<90 && /[A-Za-z]{3}/.test(l) && !generic.test(l) && !/^(category|cat\.)\s*\d$/i.test(l) && !/^(surface|superficie|draw|tabellone)\b/i.test(l));
  if(lines.length) out.name = lines[0];
  if(!out.name && url){ const slug = decodeURIComponent(url.split('/').filter(Boolean).pop()||'').replace(/[-_]+/g,' ').replace(/\.\w+$/,'').replace(/\b\d+\b/g,'').trim(); if(slug) out.name = slug.replace(/\b\w/g,c=>c.toUpperCase()); }
  if(out.cat && out.name && !out.name.toLowerCase().includes(out.cat.split(' · ')[0].toLowerCase())) out.name += ' · ' + out.cat;
  out.info = url;
  return out;
}

  upex(k){ const [ph,i]=k.split(':'); const B=editableBlocks(U.weekOpen,U.dayOpen), a=B[ph], j=+i; [a[j-1],a[j]]=[a[j],a[j-1]]; save(); },
  cancelpick(){ U.pick=null; U.planMode='weeks'; U.libOpen=null; window.scrollTo(0,0); },
  choose(k){ if(U.pick&&U.pick.own){ const pk=U.pick, g0=grp(pk.own), dd=ownSync(g0, ownOf(pk.own).weeks[pk.w-1].days[pk.d]); dd.ex.push(k); dd.exPh.push(pk.ph || mapPh(g0, exById(k))); save(); U.pick=null; U.planMode='weeks'; U.libOpen=null; toast('Esercizio inserito'); window.scrollTo(0,0); return; } const pk=U.pick, B=editableBlocks(pk.w,pk.d); B[pk.ph]=B[pk.ph]||[]; if(pk.i===null) B[pk.ph].push(k); else B[pk.ph][pk.i]=k; save(); U.pick=null; U.planMode='weeks'; U.libOpen=null; U.editDay=true; toast('Esercizio inserito'); window.scrollTo(0,0); },
  libph(k){ U.libPh=k; U.libN=40; }, libmine(){ U.libMine=!U.libMine; U.libN=40; }, libmore(){ U.libN=(U.libN||40)+40; },
  libopen(k){ U.libOpen=k; U.confirm=null; window.scrollTo(0,0); }, libclose(){ U.libOpen=null; U.confirm=null; },
  newex(){ U.ed={id:null, ph:U.libPh&&U.libPh!=='all'?U.libPh:'pr', t:'', chip:'', x:'', els:[], tool:'A', pend:null}; window.scrollTo(0,0); },
  editex(k){ U.ed=exToEd(exById(k)); U.libOpen=null; window.scrollTo(0,0); },
  filoreset(k){ if(S.filoEdit) delete S.filoEdit[k]; save(); },
  dayedex(k){ const [ph,i]=k.split(':'); const id=dayBlocks(U.weekOpen,U.dayOpen)[ph][+i]; U.ed=exToEd(exById(id), {w:U.weekOpen, d:U.dayOpen, ph, i:+i}); window.scrollTo(0,0); },
  daynewex(k){ U.ed={id:null, ph:k==='ri'?'pr':k, t:'', chip:'', x:'', els:[], vis:null, from:null, tool:'A', pend:null, ctx:{w:U.weekOpen, d:U.dayOpen, ph:k, i:null}, lib:true}; window.scrollTo(0,0); },
  delex(k){ S.customEx=S.customEx.filter(e=>e.id!==k); Object.values(S.plan||{}).forEach(B=>Object.keys(B).forEach(ph=>B[ph]=B[ph].filter(id=>id!==k))); U.libOpen=null; U.confirm=null; save(); toast('Esercizio eliminato'); },
  edclose(){ U.ed=null; }, edph(k){ U.ed.ph=k; }, tool(k){ U.ed.tool=k; U.ed.pend=null; },
  edundo(){ U.ed.els.pop(); U.ed.pend=null; }, edclear(){ U.ed.els=[]; U.ed.pend=null; },
  courttap(k,d,ev){ const E=U.ed, svg=ev.target.closest('svg'), r=svg.getBoundingClientRect();
    const x=Math.round((ev.clientX-r.left)/r.width*220), y=Math.round((ev.clientY-r.top)/r.height*110);
    if(['A','B','M'].includes(E.tool)) E.els.push([E.tool,x,y]);
    else if(E.tool==='n'){ const n=E.els.filter(e=>e[0]==='n').length+1; E.els.push(['n',x,y,n]); }
    else if(!E.pend) E.pend=[x,y];
    else { const [x1,y1]=E.pend; E.pend=null;
      if(E.tool==='z') E.els.push(['z',Math.min(x1,x),Math.min(y1,y),Math.abs(x-x1),Math.abs(y-y1)]);
      else E.els.push([E.tool, arrowPath(x1,y1,x,y, E.tool!=='ma')]); } },
  edsave(){ const E=U.ed; if(!E.t.trim()){ toast('Scrivi il titolo'); return; }

    S.customEx=S.customEx||[]; const i=S.customEx.findIndex(e=>e.id===ex.id); if(i>=0) S.customEx[i]=ex; else S.customEx.push(ex);
    if(E.ctx && E.ctx.own){ const g0=grp(E.ctx.own), dd=ownSync(g0, ownOf(E.ctx.own).weeks[E.ctx.w-1].days[E.ctx.d]); dd.ex.push(ex.id); dd.exPh.push(E.ctx.ph || mapPh(g0, ex)); save(); U.ed=null; toast('Esercizio aggiunto alla seduta'); window.scrollTo(0,0); return; }
    if(E.ctx){ const B=editableBlocks(E.ctx.w,E.ctx.d); B[E.ctx.ph]=B[E.ctx.ph]||[]; if(E.ctx.i===null) B[E.ctx.ph].push(ex.id); else B[E.ctx.ph][E.ctx.i]=ex.id; save(); U.ed=null; U.editDay=true; toast(E.ctx.i===null?'Esercizio aggiunto alla seduta':'Esercizio modificato'); window.scrollTo(0,0); return; }
    save(); U.ed=null; U.libOpen=ex.id; toast('Esercizio salvato'); window.scrollTo(0,0); },
  addtask(){ U.setup.tasks.push('Nuovo compito'); }, deltask(k){ U.setup.tasks.splice(+k,1); },
  tsel(k){ const i=+k; U.tsel=U.tsel||[]; U.tsel = U.tsel.includes(i) ? U.tsel.filter(x=>x!==i) : U.tsel.concat(i); },
  tpoint(k){ const sel=U.tsel||[]; if(!sel.length) return; S.live.points.push({t:sel.slice().sort(), w: k==='x'?null:+k}); U.tsel=[]; save(); toast('Punto segnato'); },
  tempty(){ S.live.points.push({t:[], w:null, empty:true}); save(); toast('Punto senza compito'); },
  openform(k){ U.form={kind:k, step:0, ans:{}, tpl:tplNow(k)}; window.scrollTo(0,0); }, closeform(){ U.form=null; },

  rate(k,d){ U.form.ans[k]=+d.v; },
  saveform(){ const F=U.form, a=me(), g=grp(a.groupId);
    if(F.kind==='gen' && !Object.values(F.ans).some(v=>String(v).trim())){ toast('Rispondete ad almeno una domanda'); return; }
    const nf = {id:uid(), athleteId:a.id, kind:F.kind, by:S.session.role, week:g.week, date:new Date().toISOString(), ans:F.ans}; if(F.tpl && tplCustom(F.kind)){ const {id:_i, by:_b, date:_d, ...tp} = F.tpl; nf.tpl = tp; } S.forms.push(nf); U.form=null; save(); toast(F.kind==='gen'?'Inviato al maestro':'Scheda salvata'); window.scrollTo(0,0); },
  testweek(k){ U.testWeek=+k; },
  testath(k){ U.tab='ath'; U.athleteOpen=k; U.athTab='allen'; U.testWeek=1; window.scrollTo(0,0); }, testback(){ U.testAth=null; },
  savetest(k){ const wk=U.testWeek, v={}; let any=false;
    testsDef().forEach(t=>{ const x=document.getElementById(`t-${k}-${t.k}`).value.trim().replace(',','.'); if(x!==''){ const num=+x; v[t.k]=isNaN(num)?x:num; any=true; } });
    const ex=S.tests.find(t=>t.athleteId===k && t.week===wk);
    if(ex){ ex.v=v; ex.date=new Date().toISOString(); } else if(any) S.tests.push({id:uid(), athleteId:k, week:wk, date:new Date().toISOString(), v}); else { toast('Nessun dato da salvare'); return; }
    save(); toast('Test salvati'); },
  savetests(){ const g=grp(U.resGroup), wk=U.testWeek; let n=0;
    S.athletes.filter(a=>a.groupId===g.id).forEach(a=>{ const v={}; let any=false;
      testsDef().forEach(t=>{ const x=document.getElementById(`t-${a.id}-${t.k}`).value.trim().replace(',','.'); if(x!==''){ const num=+x; v[t.k]=isNaN(num)?x:num; any=true; } });
      const ex=S.tests.find(t=>t.athleteId===a.id && t.week===wk);
      if(ex){ ex.v=v; ex.date=new Date().toISOString(); n++; } else if(any){ S.tests.push({id:uid(), athleteId:a.id, week:wk, date:new Date().toISOString(), v}); n++; } });
    save(); toast(n?`Test salvati (${n})`:'Nessun dato da salvare'); },
  undo(){ S.live.points.pop(); U.sel={ch:undefined, ex:null}; U.tsel=[]; save(); },
  finish(){ const m=S.live; if(!m.points.length){ S.live=null; U.confirm=null; save(); return; } m.done=true; S.matches.push(m); S.live=null; U.matchOpen=m.id; U.confirm=null; save(); window.scrollTo(0,0); }
};
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-a]'); if(!t || t.disabled) return;

document.addEventListener('change', e=>{
  const t = e.target, c = t.dataset?.c;

  if(c==='ftdate'){ U.ftDate=t.value||todayISO(); render(); return; }
  if(c==='ftgrp'){ U.ftGroup=t.value; render(); return; }
  if(c==='fpgrp'){ U.fpGroup=t.value; U.fpWeek=null; render(); return; }
  if(c==='mrgrp'){ U.mrGroup=t.value; U.mrAth=''; U.maOpen=null; render(); return; }
  if(c==='mrath'){ U.mrAth=t.value; U.maOpen=null; render(); return; }
  if(c==='mfgrp'){ U.mfGroup=t.value; render(); return; }
  if(c==='fitdate'){ U.fitDate=t.value||todayISO(); render(); return; }
  if(c==='snshare'){ U.snShare=t.checked; return; }
  if(c==='cleantour'){ U.clean.sel[t.dataset.k]=t.checked; return; }
  if(c==='cleanopt'){ U.clean[t.dataset.k]=t.checked; return; }
  if(c==='athname'){ const a=ath(t.dataset.k), v=t.value.trim(); if(a && v){ a.name=v; save(); toast('Nome aggiornato'); render(); } return; }
  if(c==='athmove'){ const a=ath(t.dataset.k); if(a){ a.groupId=t.value; if(t.value===PRIV_ID) privOf(a.id); save(); toast(a.name+' spostato'); render(); } return; }
  if(c==='athgrp'){ U.resGroup=t.value; U.athleteOpen=null; render(); return; }
  if(c==='lessondur'){ const g=grp(U.lessonEd), n=Math.max(30,Math.min(240,+t.value||0)); if(g && n){ lessonSnap(); scalePhases(ensureLesson(g), n); save(); render(); } return; }
  if(c==='phmin'){ lessonSnap(); const L=ensureLesson(grp(U.lessonEd)); L.phases[+t.dataset.k].m=Math.max(0,Math.min(240,+t.value||0)); save(); render(); return; }
  if(c==='mmf' && (t.type==='date'||t.type==='time')){ const [cid,mid,f]=t.dataset.k.split(':'); const m=(mCycle(cid)?.meets||[]).find(x=>x.id===mid); if(m){ m[f]=t.value; save(); render(); } return; }
  if(c==='mmform'){ const [cid,mid]=t.dataset.k.split(':'); const m=(mCycle(cid)?.meets||[]).find(x=>x.id===mid); if(m){ m.formId=t.value||undefined; save(); render(); } return; }
  if(c==='tfor'){ U.tFor=t.value; U.tOpen=null; render(); return; }
  if(c==='bty' && U.biEd){ const [i,j]=t.dataset.k.split(':').map(Number); U.biEd.tq[i].o[j].ty=t.value; return; }
  if(c==='omove'){ const d=ownSync(grp(U.planGroup), ownOf(U.planGroup).weeks[U.oWeek-1].days[U.oDay]); d.exPh[+t.dataset.k]=t.value; save(); render(); return; }
  if(c==='plangrp'){ U.planGroup=t.value; U.weekOpen=null; U.dayOpen=null; U.oWeek=null; U.oDay=null; render(); return; }

  if(c==='tdu' && U.tdEd){ U.tdEd[+t.dataset.k].u=t.value; return; }
  if(c==='bit' && U.biEd){ U.biEd[t.dataset.k]=t.value; return; }
  if(c==='biq' && U.biEd){ U.biEd.qs[+t.dataset.k].l=t.value; return; }
  if(c==='bio' && U.biEd){ U.biEd.qs[+t.dataset.k].os=t.value; return; }
  if(c==='bis' && U.biEd){ U.biEd.shots[+t.dataset.k].n=t.value; return; }

  if(c==='odtitle'){ ownOf(U.planGroup).weeks[U.oWeek-1].days[U.oDay].title=t.value; save(); return; }
  if(c==='odnote'){ ownOf(U.planGroup).weeks[U.oWeek-1].days[U.oDay].note=t.value; save(); return; }
  if(c==='mtname'){ const x=tByKey(t.dataset.k); if(x){ x.t.name=t.value; save(); } return; }
  if(c==='tpaste'){ U.tPaste=t.value; return; }
  if(c==='lk' && U.lkDraft){ U.lkDraft[t.dataset.k]=t.value; return; }
  if(c==='tnew' && U.tNew){ U.tNew[t.dataset.k]=t.value; return; }
  if(c==='tf' && U.tOpen){ const x=tByKey(U.tOpen); x.t[t.dataset.k]=t.value; save(); return; }
  if(c==='tfres' && t.tagName==='INPUT'){ const [pid,f]=t.dataset.k.split(':'); const x=tByKey(U.tOpen); x.t.results=x.t.results||{}; (x.t.results[pid]=x.t.results[pid]||{})[f]=t.value; save(); return; }
  if(c==='mm' && U.tOpen){ const [i,f]=t.dataset.k.split(':'); const r=myRes(); r.matches[+i][f]=t.value; save(); return; }
  if(c==='mres' && U.tOpen){ myRes()[t.dataset.k]=t.value; save(); return; }

  if(c==='mbn') U.setup.bName=t.value;

document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  if(e.target.id==='f-code'){ ACT.code(); render(); }
  if(e.target.id==='f-coach'){ ACT.coachin(); render(); }
